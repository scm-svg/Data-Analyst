.tscroll{max-height:640px;overflow:auto;border-radius:12px}

.exp{cursor:pointer;color:var(--navy);font-weight:800;width:18px;display:inline-block}

  function num(n, d) {
    if (n == null || n === "" || isNaN(Number(n))) return "—";
    return Number(n).toLocaleString("es-VE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function money(n) {
    var a = Math.abs(n);
    if (a >= 1e6) return "$" + (n / 1e6).toFixed(2).replace(".", ",") + "M";
    if (a >= 1e3) return "$" + (n / 1e3).toFixed(1).replace(".", ",") + "K";
    return "$" + num(n, 0);
  }
  function stock(p) { return (p.tienda || 0) + (p.taller || 0) + (p.almacen || 0); }
  function pill(c) {
    var t = c === "SV" ? "SV" : c === "SM" ? "SM" : c;
    return '<span class="pill p' + c + '">' + t + "</span>";
  }
  function cov(p) {
    if (p.cobertura == null) return p.tienda > 0 ? "Sin venta" : "Sin piso";
    return num(p.cobertura, 1) + " m";
  }
  function match(p) {
    if (state.seg && p.segmento !== state.seg) return false;
    if (state.cat && p.categoria !== state.cat) return false;
    if (state.q) {
      var blob = (p.producto + " " + p.modelo + " " + p.variantes.map(function (v) { return v.sku; }).join(" ")).toLowerCase();
      if (blob.indexOf(state.q) < 0) return false;
    }
    return true;
  }
  function of(rol) {
    return P.filter(function (p) { return p.rol === rol && match(p); });
  }

  var TABS = [
    ["resumen", "Resumen"],
    ["mesa", "Mesa A y B"],
    ["descuento", "Lista de descuento"],
    ["evaluar", "Clase B en banda"],
    ["fuera", "Best sellers fuera"]
  ];

  function bootFilters() {
    var segs = [], cats = [];
    P.forEach(function (p) {
      if (segs.indexOf(p.segmento) < 0) segs.push(p.segmento);
      if (cats.indexOf(p.categoria) < 0) cats.push(p.categoria);
    });
    segs.sort(); cats.sort();
    $("fSeg").innerHTML = '<option value="">Todos</option>' + segs.map(function (s) { return '<option>' + esc(s) + "</option>"; }).join("");
    $("fCat").innerHTML = '<option value="">Todas</option>' + cats.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("");
    $("fSeg").onchange = function (e) { state.seg = e.target.value; render(); };
    $("fCat").onchange = function (e) { state.cat = e.target.value; render(); };
    $("fQ").oninput = function (e) { state.q = e.target.value.trim().toLowerCase(); render(); };
  }

  function head() {
    $("sub").textContent = "Ventas al " + META.ventas_hasta + " · inventario al " + META.inventario_al + " · Retail · la letra es la del producto en la matriz";
    var sum = function (rol, key) {
      return P.filter(function (p) { return p.rol === rol; }).reduce(function (s, p) { return s + (key ? p[key] : stock(p)); }, 0);
    };
    var n = function (rol) { return P.filter(function (p) { return p.rol === rol; }).length; };
    var mesaN = P.filter(function (p) { return p.mesa; }).length;
    var mesaS = P.filter(function (p) { return p.mesa; }).reduce(function (s, p) { return s + stock(p); }, 0);
    $("kpis").innerHTML =
      kpi(n("fuera"), "Best sellers fuera") +
      kpi(mesaN, "A y B en la mesa") +
      kpi(n("descuento"), "En el descuento") +
      kpi(num(sum("descuento")), "Piezas a descontar");
    $("rules").innerHTML =
      rule("", n("fuera") + " productos", "Fuera del descuento", "La clase A entra entera. Colores y tallas usan esa letra y no van a Black Friday. Son " + num(sum("fuera")) + " piezas.") +
      rule("mesa", mesaN + " productos", "Mesa de inventario alto", "A y B con cobertura por encima de la banda, o piezas solo en taller y almacén, y al menos " + META.min_mesa + " piezas. " + num(mesaS) + " piezas para definir con las otras áreas. El A se redistribuye y no se descuenta.") +
      rule("desc", n("descuento") + " productos", "Lista de descuento", "Lo que no es best seller y sí tiene piezas: clase C, sin venta y sin margen, en todas las categorías. " + num(sum("descuento")) + " piezas.");
    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button class="tab' + (state.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
    }).join("");
    $("tabs").querySelectorAll(".tab").forEach(function (b) {
      b.onclick = function () { state.tab = b.getAttribute("data-tab"); render(); };
    });
    $("fbar").hidden = state.tab === "resumen";
  }
  function kpi(v, l) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + "</div></div>"; }
  function rule(cls, n, t, p) { return '<article class="rule ' + cls + '"><div class="n">' + n + "</div><h2>" + t + "</h2><p>" + p + "</p></article>"; }

  function cols() {
    return "<tr><th></th><th>Producto</th><th>Clase</th><th class=\"r\">SKUs</th><th class=\"r\">Venta/mes</th><th class=\"r\">Tienda</th><th class=\"r\">Taller</th><th class=\"r\">Almacén</th><th class=\"r\">Cobertura</th><th class=\"r\">Costo stock</th><th>Qué hacer</th></tr>";
  }
  function row(p) {
    var id = esc(p.producto);
    var on = !!open[p.producto];
    var tag = p.antes ? '<div class="tag">Estaba en la lista anterior</div>' : "";
    var html = "<tr><td><span class=\"exp\" data-p=\"" + id + "\">" + (on ? "▼" : "▶") + "</span></td><td><b>" + esc(p.producto) + "</b>" + tag + '<div class="mini">' + esc(p.categoria) + "</div></td><td>" + pill(p.clase) + "</td><td class=\"r\">" + p.variantes.length + "</td><td class=\"r\">" + num(p.venta_mes, 1) + "</td><td class=\"r\">" + num(p.tienda) + "</td><td class=\"r\">" + num(p.taller) + "</td><td class=\"r\">" + num(p.almacen) + "</td><td class=\"r\">" + cov(p) + "</td><td class=\"r\">" + money(p.costo) + "</td><td>" + esc(p.accion) + "</td></tr>";
    if (on) {
      html += '<tr class="row-var"><td></td><td colspan="10"><table><tr><th>SKU</th><th>Color</th><th>Talla</th><th class="r">Tienda</th><th class="r">Taller</th><th class="r">Almacén</th><th class="r">Vendido</th><th class="r">Margen</th></tr>' +
        p.variantes.map(function (v) {
          return "<tr><td>" + esc(v.sku) + "</td><td>" + esc(v.color || "—") + "</td><td>" + esc(v.talla || "—") + "</td><td class=\"r\">" + num(v.tienda) + "</td><td class=\"r\">" + num(v.taller) + "</td><td class=\"r\">" + num(v.almacen) + "</td><td class=\"r\">" + num(v.unidades) + "</td><td class=\"r\">" + money(v.margen) + "</td></tr>";
        }).join("") + "</table></td></tr>";
    }
    return html;
  }
  function table(list, empty) {
    if (!list.length) return '<p class="mini">' + empty + "</p>";
    return '<div class="tscroll"><table>' + cols() + list.map(row).join("") + "</table></div>";
  }
  function bind() {
    document.querySelectorAll(".exp").forEach(function (el) {
      el.onclick = function () {
        var k = el.getAttribute("data-p");
        open[k] = !open[k];
        render();
      };
    });
  }
  function bars(groups) {
    var max = Math.max.apply(null, groups.map(function (g) { return g[1]; }).concat([1]));
    return '<div class="bars">' + groups.map(function (g) {
      var w = Math.max(2, Math.round(100 * g[1] / max));
      return '<div class="barline"><span>' + esc(g[0]) + '</span><div class="track"><span style="width:' + w + '%"></span></div><b>' + num(g[1]) + "</b></div>";
    }).join("") + "</div>";
  }
  function resumen() {
    var by = {};
    P.forEach(function (p) {
      var k = p.rol === "fuera" ? "Best sellers" : p.rol === "mesa" ? "Mesa B" : p.rol === "evaluar" ? "B en banda" : "Descuento";
      by[k] = (by[k] || 0) + stock(p);
    });
    var order = ["Best sellers", "Mesa B", "B en banda", "Descuento"];
    var ant = META.anterior_por_rol || {};
    var antTxt = "De las " + num(META.anterior_skus) + " variantes de la lista anterior, en este corte hay " + num(ant.fuera || 0) + " que hoy son best seller, " + num(ant.mesa || 0) + " en la mesa de la clase B, " + num(ant.evaluar || 0) + " en B dentro de la banda y " + num(ant.descuento || 0) + " que siguen en el descuento.";
    var mesa = P.filter(function (p) { return p.mesa; }).slice(0, 8);
    var desc = P.filter(function (p) { return p.rol === "descuento"; }).slice(0, 8);
    return '<div class="g2"><div class="card"><h3>Dónde están las piezas</h3><p class="mini">Tienda + taller + almacén, al ' + META.inventario_al + '.</p>' + bars(order.map(function (k) { return [k, by[k] || 0]; })) + '</div><div class="card"><h3>La lista anterior</h3><p class="mini">' + antTxt + " El resto de aquellas variantes ya no tiene piezas en este inventario.</p><p class=\"mini\" style=\"margin-top:8px\">Cobertura = piezas en tienda ÷ venta por mes del año. Manufactura: A pasa de 4 meses y B de 6. Equipamiento: A pasa de 8 y B de 10.</p></div></div>" +
      '<div class="card"><h3>Lo que más pesa en la mesa</h3><p class="mini">A y B con inventario alto. El A no se descuenta.</p>' + table(mesa, "Sin casos") + "</div>" +
      '<div class="card"><h3>Lo que más pesa en el descuento</h3><p class="mini">Clase C, sin venta y sin margen. No son best sellers.</p>' + table(desc, "Sin casos") + "</div>";
  }
  function render() {
    head();
    var html = "";
    if (state.tab === "resumen") html = resumen();
    else if (state.tab === "mesa") html = '<div class="card"><h3>Mesa con las otras áreas</h3><p class="mini">Productos A y B con inventario alto. El A se mueve y se sigue vendiendo. El B se decide aquí antes de meterlo a un descuento.</p>' + table(P.filter(function (p) { return p.mesa && match(p); }), "Nada con estos filtros") + "</div>";
    else if (state.tab === "descuento") html = '<div class="card"><h3>Lista de descuento</h3><p class="mini">Entran todas las categorías que no son best seller y tienen piezas para liquidar: C, sin venta y sin margen.</p>' + table(of("descuento"), "Nada con estos filtros") + "</div>";
    else if (state.tab === "evaluar") html = '<div class="card"><h3>Clase B dentro de la banda</h3><p class="mini">No son best sellers, así que quedan en la matriz. La cobertura está dentro de la banda: no priorizar un descuento.</p>' + table(of("evaluar"), "Nada con estos filtros") + "</div>";
    else html = '<div class="card"><h3>Best sellers fuera del descuento</h3><p class="mini">Clase A del producto. Si además tienen inventario alto, también están en la mesa, con la indicación de redistribuir.</p>' + table(of("fuera"), "Nada con estos filtros") + "</div>";
    $("view").innerHTML = html;
    bind();
  }
  bootFilters();
  render();
})();
</script>
</body>
</html>
