<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tracking Producción</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ef;
  --bg2:#e4ebe6;
  --paper:#fbfcfb;
  --ink:#1c2421;
  --muted:#5f6d66;
  --line:#c9d4cd;
  --teal:#0f6b5c;
  --teal-soft:#d7eee8;
  --amber:#b86a1a;
  --amber-soft:#f7e6d0;
  --rose:#a33b45;
  --rose-soft:#f4d9dc;
  --ok:#2f6b45;
  --ok-soft:#d9eadf;
  --fh:'Bricolage Grotesque',sans-serif;
  --fb:'Figtree',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--fb);
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, #d9ebe4 0%, transparent 55%),
    radial-gradient(900px 420px at 100% 0%, #e8e3d4 0%, transparent 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:repeating-linear-gradient(-18deg, transparent 0 11px, rgba(15,107,92,.035) 11px 12px);
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 22px 48px}
.brand{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:22px;animation:rise .55s ease both;
}
.brand h1{
  font-family:var(--fh);font-weight:800;font-size:clamp(2rem,4vw,2.85rem);
  letter-spacing:-.04em;line-height:.95;color:var(--ink);
}
.brand h1 span{display:block;color:var(--teal)}
.brand p{color:var(--muted);font-size:.92rem;max-width:34ch;margin-top:8px}
.brand-actions{display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-family:var(--fb);font-weight:600;font-size:.85rem;
  padding:9px 14px;border-radius:10px;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{transform:translateY(-1px);border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#0c574b}

.kpis{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;
  animation:rise .55s ease .06s both;
}
.kpi{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  transition:transform .2s ease, box-shadow .2s ease;
}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(28,36,33,.06)}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--fh);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:6px}
.kpi.warn .v{color:var(--rose)}
.kpi.ok .v{color:var(--ok)}
.kpi.teal .v{color:var(--teal)}

.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;
  margin-bottom:14px;animation:rise .55s ease .12s both;
}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px;flex:1}
.field.grow{flex:2;min-width:180px}
.field label{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field select,.field input{
  width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:9px 11px;font:500 .9rem var(--fb);outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field select:focus,.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,107,92,.12)}

.layout{display:grid;grid-template-columns:1.7fr .9fr;gap:14px;animation:rise .55s ease .18s both}
@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .layout{grid-template-columns:1fr}
}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}

.section-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;
}
.section-title h2{font-family:var(--fh);font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.section-title span{font-size:.8rem;color:var(--muted)}

.table-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{
  position:sticky;top:0;background:#f3f7f4;color:var(--muted);text-align:left;
  font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2;
}
td{padding:10px 12px;border-bottom:1px solid #e6ece8;vertical-align:middle;white-space:nowrap}
tr:hover td{background:#f5faf7}
.num{font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--fh)}
.falt{color:var(--rose)}
.done{color:var(--ok)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;
  font-size:.75rem;font-weight:700;background:var(--teal-soft);color:var(--teal);
}
.chip.eq{background:var(--amber-soft);color:var(--amber)}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.conf{background:var(--teal-soft);color:var(--teal)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--rose-soft);color:var(--rose)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.bar{height:7px;background:#e6ece8;border-radius:99px;overflow:hidden;min-width:64px}
.bar > i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s ease}

.side .block{margin-bottom:18px}
.side .block:last-child{margin-bottom:0}
.prod-row,.line-row{
  display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
  padding:8px 0;border-bottom:1px solid #e6ece8;font-size:.86rem;
}
.prod-row:last-child,.line-row:last-child{border-bottom:none}
.prod-row .meta,.line-row .meta{grid-column:1 / -1;color:var(--muted);font-size:.75rem}
.meter{grid-column:1 / -1;height:8px;background:#e6ece8;border-radius:99px;overflow:hidden;display:flex}
.meter .a{background:var(--ok)}
.meter .b{background:var(--rose)}

.cal{display:flex;flex-direction:column;gap:8px}
.cal-day{
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;
  transition:border-color .15s ease;
}
.cal-day:hover{border-color:var(--teal)}
.cal-day h3{font-family:var(--fh);font-size:.95rem;font-weight:800;margin-bottom:2px}
.cal-day p{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.cal-day li{list-style:none;font-size:.78rem;padding:2px 0;color:var(--ink)}

.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:.9rem}
.toast{
  position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;
  padding:10px 14px;border-radius:10px;font-size:.84rem;display:none;z-index:20;
  animation:rise .25s ease;
}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>

</div>

<script>
var DATA=null, SORT={k:'fechaEstimada',dir:1}, COLORS={
  'Blanco':'#f4f4f0','Negro':'#2b2b2b','Azul Rey':'#1e4fd6','Verde Militar':'#4b6b2f',
  'Azul Polo':'#2a6bd6','Gris Claro':'#b7b7b7','Azul Marino':'#16356b','Aguamarina':'#2bb3a0'
};

function isGas(){return typeof google!=='undefined' && google.script && google.script.run;}
function boot(){
  if(window.EMBEDDED_DATA){init(window.EMBEDDED_DATA);return;}
  if(isGas()){
    google.script.run.withSuccessHandler(init).withFailureHandler(function(e){bootErr(e);}).getDashboardData(false);
    return;
  }
  bootErr('Sin datos.');
}
function bootErr(e){
  var el=document.getElementById('boot');
  if(el) el.textContent='No se pudo cargar: '+(e&&e.message?e.message:e);
}
function init(payload){
  DATA=payload;
  renderShell();
  renderAll();
}
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.style.display='block';
  setTimeout(function(){t.style.display='none';},2400);
}
function recalc(){
  if(!isGas()) return;
  toast('Recalculando…');
  google.script.run.withSuccessHandler(function(p){
    DATA=p;renderAll();toast((p.meta&&p.meta.fechasEscritas||0)+' fechas escritas');
  }).withFailureHandler(function(e){toast('Error: '+e);}).getDashboardData(true);
}

function uniq(arr){
  var o={},out=[];
  arr.forEach(function(v){if(v && !o[v]){o[v]=1;out.push(v);}});
  return out.sort(function(a,b){return String(a).localeCompare(String(b),'es');});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function fmtN(n){return Math.round(Number(n)||0).toLocaleString('es-VE');}
function fmtDate(s){
  if(!s) return '—';
  var p=String(s).slice(0,10).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s;
}
function sum(rows,k){return rows.reduce(function(a,r){return a+(Number(r[k])||0);},0);}
function cn(c){return COLORS[c]||'#7a8a82';}

function renderShell(){
  var gasBtn=isGas()?'<button class="btn primary" onclick="recalc()">Recalcular fechas</button>':'';
  document.getElementById('app').innerHTML=
    '<header class="brand">'+
      '<div><h1>Tracking<span>Producción</span></h1>'+
      '<p id="sub">Pedidos, faltante y fecha estimada de salida</p></div>'+
      '<div class="brand-actions">'+gasBtn+'</div>'+
    '</header>'+
    '<section class="kpis" id="kpis"></section>'+
    '<section class="panel"><div class="filters" id="filters"></div></section>'+
    '<div class="layout">'+
      '<section class="panel">'+
        '<div class="section-title"><h2>Pedidos</h2><span id="tblMeta"></span></div>'+
        '<div class="table-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>'+
      '</section>'+
      '<aside class="panel side">'+
        '<div class="block"><div class="section-title"><h2>Por producto</h2></div><div id="byProd"></div></div>'+
        '<div class="block"><div class="section-title"><h2>Carga por línea</h2></div><div id="byLine"></div></div>'+
        '<div class="block"><div class="section-title"><h2>Próximas salidas</h2></div><div class="cal" id="cal"></div></div>'+
      '</aside>'+
    '</div>';
  buildFilters();
}

function buildFilters(){
  var rows=DATA.rows||[];
  var fields=[
    ['fProducto','Producto',uniq(rows.map(function(r){return r.producto;}))],
    ['fTipo','Tipo',uniq(rows.map(function(r){return r.tipo;}))],
    ['fLinea','Línea',uniq(rows.map(function(r){return r.lineasRaw;}))],
    ['fEtapa','Etapa',uniq(rows.map(function(r){return r.etapa;}))],
    ['fStatus','Status',uniq(rows.map(function(r){return r.status;}))],
    ['fColor','Color',uniq(rows.map(function(r){return r.color;}))],
    ['fTalla','Talla',uniq(rows.map(function(r){return r.talla;}))]
  ];
  var html=fields.map(function(f){
    return '<div class="field"><label>'+f[1]+'</label><select id="'+f[0]+'" onchange="renderAll()">'+
      '<option value="">Todos</option>'+f[2].map(function(v){return '<option>'+esc(v)+'</option>';}).join('')+
      '</select></div>';
  }).join('');
  html+='<div class="field grow"><label>Buscar</label><input id="fQ" placeholder="MO, SKU, cliente…" oninput="renderAll()"></div>';
  html+='<div class="field" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn" onclick="resetFilters()">Limpiar</button></div>';
  document.getElementById('filters').innerHTML=html;
}
function resetFilters(){
  ['fProducto','fTipo','fLinea','fEtapa','fStatus','fColor','fTalla'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.value='';
  });
  var q=document.getElementById('fQ'); if(q) q.value='';
  renderAll();
}
function fr(){
  var get=function(id){var el=document.getElementById(id);return el?el.value:'';};
  var q=(get('fQ')||'').toLowerCase();
  var prod=get('fProducto'), tipo=get('fTipo'), linea=get('fLinea'), etapa=get('fEtapa');
  var status=get('fStatus'), color=get('fColor'), talla=get('fTalla');
  return (DATA.rows||[]).filter(function(r){
    if(prod && r.producto!==prod) return false;
    if(tipo && r.tipo!==tipo) return false;
    if(linea && r.lineasRaw!==linea) return false;
    if(etapa && r.etapa!==etapa) return false;
    if(status && r.status!==status) return false;
    if(color && r.color!==color) return false;
    if(talla && r.talla!==talla) return false;
    if(q){
      var blob=[r.mo,r.sku,r.producto,r.color,r.cliente,r.concatenado].join(' ').toLowerCase();
      if(blob.indexOf(q)<0) return false;
    }
    return true;
  });
}

function renderAll(){
  if(!DATA) return;
  var rows=fr();
  document.getElementById('sub').textContent=
    (DATA.sheetName||'Tracking')+' · desde '+fmtDate(DATA.startDate)+' · '+fmtDate(DATA.generatedAt);
  renderKpis(rows);
  renderTable(rows);
  renderByProd(rows);
  renderByLine(rows);
  renderCal(rows);
}

function renderKpis(rows){
  var sol=sum(rows,'solicitada'), prod=sum(rows,'producida'), falt=sum(rows,'faltante');
  var av=sol>0?Math.round(100*prod/sol):0;
  var fechas=rows.map(function(r){return r.fechaEstimada;}).filter(Boolean).sort();
  document.getElementById('kpis').innerHTML=
    '<div class="kpi teal"><div class="l">Solicitado</div><div class="v">'+fmtN(sol)+'</div><div class="s">'+rows.length+' SKUs</div></div>'+
    '<div class="kpi ok"><div class="l">Producido</div><div class="v">'+fmtN(prod)+'</div><div class="s">'+av+'% avance</div></div>'+
    '<div class="kpi warn"><div class="l">Faltante</div><div class="v">'+fmtN(falt)+'</div><div class="s">'+(rows.filter(function(r){return r.faltante>0;}).length)+' en cola</div></div>'+
    '<div class="kpi"><div class="l">Última salida</div><div class="v" style="font-size:1.55rem">'+(fechas.length?fmtDate(fechas[fechas.length-1]):'—')+'</div><div class="s">días lab. '+(DATA.workdays||[]).join(',')+'</div></div>';
}

function etapaChip(e){
  var t=String(e||'').toLowerCase();
  var cls='wait';
  if(t.indexOf('espera')>=0) cls='wait';
  else if(t.indexOf('confeccion')>=0) cls='conf';
  else if(t.indexOf('termin')>=0) cls='ok';
  return '<span class="chip '+cls+'">'+esc(e||'—')+'</span>';
}
function statusChip(s){
  var t=String(s||'').toLowerCase();
  var cls=t.indexOf('progreso')>=0?'prog':(t.indexOf('confirm')>=0?'ok':'eq');
  return '<span class="chip '+cls+'">'+esc(s||'—')+'</span>';
}

var COLS=[
  {k:'mo',l:'MO'},{k:'producto',l:'Producto'},{k:'sku',l:'SKU'},{k:'color',l:'Color'},
  {k:'talla',l:'Talla'},{k:'solicitada',l:'Solic.'},{k:'producida',l:'Prod.'},
  {k:'faltante',l:'Falt.'},{k:'avance',l:'Avance'},{k:'lineaAsignada',l:'Línea'},
  {k:'fechaEstimada',l:'Salida'},{k:'etapa',l:'Etapa'},{k:'status',l:'Status'}
];

function renderTable(rows){
  var thead='<tr>'+COLS.map(function(c){
    var mark=SORT.k===c.k?(SORT.dir>0?' ↑':' ↓'):'';
    return '<th onclick="sortBy(\''+c.k+'\')">'+c.l+mark+'</th>';
  }).join('')+'</tr>';
  document.querySelector('#tbl thead').innerHTML=thead;

  var sorted=rows.slice().sort(function(a,b){
    var va=a[SORT.k], vb=b[SORT.k];
    if(va==null) va=''; if(vb==null) vb='';
    if(typeof va==='number' && typeof vb==='number') return (va-vb)*SORT.dir;
    return String(va).localeCompare(String(vb),'es')*SORT.dir;
  });

  document.querySelector('#tbl tbody').innerHTML=sorted.length?sorted.map(function(r){
    var av=r.solicitada>0?Math.min(100,Math.round(100*r.producida/r.solicitada)):(r.faltante<=0?100:0);
    return '<tr>'+
      '<td class="num">'+esc(r.mo||'—')+'</td>'+
      '<td>'+esc(r.producto)+' <span class="chip '+(r.tipo==='Equipamiento'?'eq':'')+'" style="margin-left:4px">'+esc(r.tipo||'')+'</span></td>'+
      '<td>'+esc(r.sku||'—')+'</td>'+
      '<td><span class="dot" style="background:'+cn(r.color)+'"></span> '+esc(r.color||'—')+'</td>'+
      '<td>'+esc(r.talla||'—')+'</td>'+
      '<td class="num">'+fmtN(r.solicitada)+'</td>'+
      '<td class="num">'+fmtN(r.producida)+'</td>'+
      '<td class="num '+(r.faltante>0?'falt':'done')+'">'+fmtN(r.faltante)+'</td>'+
      '<td><div class="bar" title="'+av+'%"><i style="width:'+av+'%"></i></div></td>'+
      '<td>'+esc(r.lineaAsignada||r.lineasRaw||'—')+'</td>'+
      '<td class="num">'+fmtDate(r.fechaEstimada)+'</td>'+
      '<td>'+etapaChip(r.etapa)+'</td>'+
      '<td>'+statusChip(r.status)+'</td>'+
    '</tr>';
  }).join(''):'<tr><td colspan="13" class="empty">Sin pedidos con este filtro</td></tr>';

  document.getElementById('tblMeta').textContent=
    sorted.length+' filas · faltante '+fmtN(sum(sorted,'faltante'));
}
function sortBy(k){
  if(SORT.k===k) SORT.dir*=-1; else {SORT.k=k;SORT.dir=1;}
  renderTable(fr());
}

function renderByProd(rows){
  var map={};
  rows.forEach(function(r){
    if(!map[r.producto]) map[r.producto]={sol:0,prod:0,falt:0};
    map[r.producto].sol+=r.solicitada;
    map[r.producto].prod+=r.producida;
    map[r.producto].falt+=r.faltante;
  });
  var keys=Object.keys(map).sort(function(a,b){return map[b].falt-map[a].falt;});
  document.getElementById('byProd').innerHTML=keys.length?keys.map(function(k){
    var x=map[k], tot=x.sol||1;
    var p=Math.round(100*x.prod/tot), f=Math.round(100*x.falt/tot);
    return '<div class="prod-row"><strong>'+esc(k)+'</strong><span class="num">'+fmtN(x.falt)+' falt.</span>'+
      '<div class="meter"><span class="a" style="width:'+p+'%"></span><span class="b" style="width:'+f+'%"></span></div>'+
      '<div class="meta">'+fmtN(x.prod)+' / '+fmtN(x.sol)+' · '+p+'% avance</div></div>';
  }).join(''):'<div class="empty">Sin datos</div>';
}

function renderByLine(rows){
  var caps=DATA.lineCaps||{}, load=DATA.lineLoad||{};
  var lines=uniq(Object.keys(caps).concat(Object.keys(load)).concat(rows.map(function(r){return r.lineaAsignada;}).filter(Boolean)));
  if(!lines.length){document.getElementById('byLine').innerHTML='<div class="empty">Sin líneas</div>';return;}
  document.getElementById('byLine').innerHTML=lines.map(function(ln){
    var cap=caps[ln]||130;
    var ld=load[ln];
    if(ld==null) ld=sum(rows.filter(function(r){return r.lineaAsignada===ln;}),'faltante');
    var days=cap>0?Math.ceil(ld/cap):0;
    var pct=Math.min(100, days?Math.round(100*Math.min(days,14)/14):0);
    return '<div class="line-row"><strong>Línea '+esc(ln)+'</strong><span class="num">'+days+' d</span>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+(days>7?'var(--rose)':(days>3?'var(--amber)':'var(--teal)')+')"></i></div>'+
      '<div class="meta">'+fmtN(ld)+' pz · '+fmtN(cap)+'/día</div></div>';
  }).join('');
}

function renderCal(rows){
  var map={};
  rows.filter(function(r){return r.fechaEstimada;}).forEach(function(r){
    if(!map[r.fechaEstimada]) map[r.fechaEstimada]=[];
    map[r.fechaEstimada].push(r);
  });
  var days=Object.keys(map).sort().slice(0,8);
  document.getElementById('cal').innerHTML=days.length?days.map(function(d){
    var list=map[d], pcs=sum(list,'faltante');
    return '<div class="cal-day"><h3>'+fmtDate(d)+'</h3><p>'+list.length+' SKUs · '+fmtN(pcs)+' pz</p><ul>'+
      list.slice(0,5).map(function(r){
        return '<li>'+esc(r.producto)+' '+esc(r.talla)+' · L'+esc(r.lineaAsignada)+' · '+fmtN(r.faltante)+'</li>';
      }).join('')+(list.length>5?'<li>… +'+(list.length-5)+' más</li>':'')+
      '</ul></div>';
  }).join(''):'<div class="empty">Sin salidas pendientes</div>';
}

boot();
</script>
</body>
</html>
