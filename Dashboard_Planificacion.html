<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Planificación de Producción</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0e0f14;--surf:#16171f;--s2:#1e1f2b;--s3:#252637;--brd:#2a2b3a;--tx:#f0f0f5;--mu:#7a7b95;--mu2:#4a4b65;--ac:#5b6af7;--a2:#f75b8a;--gr:#4caf76;--rd:#ef4444;--yw:#ffc107;--l5:#a78bfa;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--r:14px}
body.light{--bg:#f5f6fa;--surf:#ffffff;--s2:#f0f1f5;--s3:#e5e6ed;--brd:#d8d9e3;--tx:#1a1a2e;--mu:#6b6c85;--mu2:#9a9bb5;--ac:#5b6af7;--a2:#f75b8a;--gr:#2e9e5e;--rd:#dc3545;--yw:#e6a800;--l5:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;transition:background .3s,color .3s}
.hdr{background:linear-gradient(135deg,#0d0e13 0%,#191a2d 55%,#0d0e13 100%);border-bottom:1px solid var(--brd);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
body.light .hdr{background:linear-gradient(135deg,#e8e9f3 0%,#f5f6fa 55%,#e8e9f3 100%)}
.hdr-l h1{font-family:var(--fh);font-size:1.55rem;font-weight:800;letter-spacing:-.5px}
.hdr-l h1 em{color:var(--ac);font-style:normal}
.hdr-l p{color:var(--mu);font-size:.8rem;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpi-bar{display:flex;gap:10px;flex-wrap:wrap}
.kpib{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:9px 14px;text-align:center;min-width:76px}
.kpib .kv{font-family:var(--fh);font-size:1.3rem;font-weight:800;color:var(--ac);line-height:1}
.kpib .kl{font-size:.64rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.theme-btn,.fbtn{background:var(--s2);border:1px solid var(--brd);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-family:var(--fb);transition:all .2s}
.theme-btn:hover,.fbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.mbar{background:var(--s2);border-bottom:2px solid var(--brd);padding:12px 40px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mbar-lbl{font-size:.68rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-right:4px;white-space:nowrap}
.mbtn{display:flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--brd);color:var(--mu);border-radius:20px;padding:6px 12px;font-family:var(--fb);font-size:.72rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.mbtn:hover{background:rgba(91,106,247,.15);color:var(--tx);border-color:var(--ac)}
.mbtn.active{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.mbtn .mcnt{background:rgba(255,255,255,.22);border-radius:10px;padding:1px 6px;font-size:.62rem;font-weight:700}
.mbtn:not(.active) .mcnt{background:var(--mu2);color:var(--bg)}
.fbar{background:var(--surf);border-bottom:1px solid var(--brd);padding:10px 40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbar label{font-size:.68rem;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.fbar select,.fbar input{background:var(--s2);color:var(--tx);border:1px solid var(--brd);border-radius:7px;padding:5px 10px;font-family:var(--fb);font-size:.78rem;outline:none}
.fbar select:focus,.fbar input:focus{border-color:var(--ac)}
.ebar{background:var(--surf);border-bottom:1px solid var(--brd);padding:7px 40px;display:flex;gap:8px;align-items:center}
.ebar button{background:var(--s2);color:var(--mu);border:1px solid var(--brd);border-radius:7px;padding:5px 12px;font-family:var(--fb);font-size:.73rem;cursor:pointer}
.ebar button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:2px;padding:12px 40px 0;border-bottom:1px solid var(--brd);background:var(--surf);overflow-x:auto}
.tab{padding:8px 16px;font-family:var(--fh);font-size:.78rem;font-weight:700;color:var(--mu);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
.tab.active{color:var(--tx);border-bottom-color:var(--ac);background:var(--s2)}
.tab:hover:not(.active){color:var(--tx);background:rgba(255,255,255,.04)}
.content{padding:22px 40px;max-width:1600px;margin:0 auto}
.sec{display:none}.sec.active{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.tkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.tkpi{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:11px;text-align:center}
.tkpi .tv{font-family:var(--fh);font-size:1.15rem;font-weight:800;color:var(--ac)}
.tkpi .tl{font-size:.66rem;color:var(--mu);text-transform:uppercase;margin-top:2px}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card:hover{border-color:#3a3b55}
.card h3{font-family:var(--fh);font-size:.88rem;font-weight:700;margin-bottom:2px}
.sub{font-size:.7rem;color:var(--mu);margin-bottom:12px}
.cw{position:relative;height:220px}.cw.t{height:280px}
.ctwrap{overflow:auto;max-height:560px}
.ct{width:100%;border-collapse:collapse;font-size:.78rem}
.ct th{color:var(--mu);padding:6px 8px;text-align:left;border-bottom:1px solid var(--brd);font-size:.64rem;text-transform:uppercase;position:sticky;top:0;background:var(--surf);z-index:1;white-space:nowrap}
.ct td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
.ct tr:hover td{background:rgba(91,106,247,.06)}
.num{font-family:var(--fh);font-weight:700;text-align:right;white-space:nowrap}
.ct.ct-mid th,.ct.ct-mid td{text-align:center}
.ct.ct-mid th.left,.ct.ct-mid td.left{text-align:left}
.ct.ct-mid .num{text-align:center}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;font-size:.68rem;font-weight:800;color:#fff;margin:0 2px}
.c1{background:#5b6af7}.c2{background:#f75b8a}.c3{background:#4caf76}.c4{background:#e6a800}.c5{background:#7c3aed}
.heat{border-radius:8px;padding:6px 4px;text-align:center;font-family:var(--fh);font-weight:800;font-size:.78rem;min-width:52px}
.daycell{min-height:64px;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.68rem}
.daycell b{display:block;font-size:.62rem;color:var(--mu);margin-bottom:4px}
.dayhead{min-height:auto;background:linear-gradient(180deg,rgba(91,106,247,.22),rgba(91,106,247,.08));border:1px solid rgba(91,106,247,.45);border-bottom:3px solid var(--ac);border-radius:10px;padding:10px 8px 9px;text-align:center}
.dayhead .dn{display:block;font-family:var(--fh);font-size:.84rem;font-weight:800;color:var(--tx);letter-spacing:.2px;line-height:1.15}
.dayhead .dd{display:block;margin-top:4px;font-family:var(--fh);font-size:.78rem;font-weight:700;color:var(--ac)}
body.light .dayhead{background:linear-gradient(180deg,#eef0ff,#e4e7fb);border-color:#c5caf5}
.pill{display:inline-block;background:var(--s3);border-radius:999px;padding:2px 7px;margin:1px;font-size:.64rem}
.tl{width:100%;border-collapse:separate;border-spacing:0}
.tl th,.tl td{padding:8px 6px;border-bottom:1px solid var(--brd);text-align:center;min-width:70px}
.tl th{font-size:.62rem;color:var(--mu);text-transform:uppercase;position:sticky;top:0;background:var(--surf);z-index:2}
.tl td.prod{text-align:left;font-weight:700;font-family:var(--fh);font-size:.74rem;white-space:nowrap;position:sticky;left:0;background:var(--surf);max-width:240px;overflow:hidden;text-overflow:ellipsis;min-width:200px;z-index:1}
.tl-dots{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}
.note{background:var(--s2);border-left:3px solid var(--ac);padding:10px 12px;border-radius:8px;font-size:.78rem;color:var(--mu);margin-bottom:8px}
.note.expand{cursor:pointer;user-select:none}
.note.expand:before{content:'▸ ';color:var(--ac)}
.note.expand.open:before{content:'▾ '}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px}
.b-ok{background:rgba(76,175,118,.2);color:var(--gr)}
.b-bad{background:rgba(239,68,68,.2);color:var(--rd)}
.b-mut{background:var(--s3);color:var(--mu)}
.tr-exp{cursor:pointer}
.tr-exp .chev{color:var(--ac);display:inline-block;width:14px}
.sku-row td{background:var(--s2);font-size:.72rem}
.cal-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:6px}
.footer{text-align:center;color:var(--mu);font-size:.68rem;padding:14px 40px;border-top:1px solid var(--brd);margin-top:8px}
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.g2,.g3,.cal-grid{grid-template-columns:1fr}.content,.fbar,.tabs,.hdr,.ebar,.mbar{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <h1>Planificación · <em id="titleModelo">información</em></h1>
    <p id="status">Plan de producción · Excel (16)</p>
  </div>
  <div class="hdr-r">
    <div class="kpi-bar">
      <div class="kpib"><div class="kv" id="k-plan">—</div><div class="kl" id="k-plan-lbl">Plan</div></div>
      <div class="kpib"><div class="kv" id="k-pend">—</div><div class="kl">Pendiente</div></div>
      <div class="kpib"><div class="kv" id="k-alm">—</div><div class="kl">Almacén</div></div>
      <div class="kpib"><div class="kv" id="k-mod">—</div><div class="kl">Modelos</div></div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
  </div>
</div>
<div class="mbar" id="mbar">
  <span class="mbar-lbl">Modelo:</span>
</div>
<div class="fbar">
  <label>Buscar</label>
  <input id="q" placeholder="Modelo / SKU / MO" oninput="onFilter()">
  <label>Línea</label>
  <select id="f-lin" onchange="onFilter()"><option value="">Todas</option></select>
  <label>Semana</label>
  <select id="f-sem" onchange="onFilter()"></select>
  <button class="fbtn" onclick="resetFilters()">↺ Limpiar</button>
</div>
<div class="ebar">
  <button onclick="exportCSV()">📥 CSV</button>
  <span style="font-size:.66rem;color:var(--mu)">Exporta la pestaña activa</span>
</div>
<div class="tabs">
  <button class="tab active" data-tab="cal">📅 Calendario</button>
  <button class="tab" data-tab="salida">📦 Salida semanal</button>
  <button class="tab" data-tab="seg">● Seguimiento</button>
  <button class="tab" data-tab="pend">⏳ Pendientes</button>
  <button class="tab" data-tab="alm">🏭 Almacén</button>
  <button class="tab" data-tab="sup">⚙️ Supuestos</button>
</div>
<div class="content">
  <div id="sec-cal" class="sec active"></div>
  <div id="sec-salida" class="sec"></div>
  <div id="sec-seg" class="sec"></div>
  <div id="sec-pend" class="sec"></div>
  <div id="sec-alm" class="sec"></div>
  <div id="sec-sup" class="sec"></div>
</div>
<div class="footer">Planificación de producción · v<span id="footVer"></span> · archivo autónomo (abrir en el navegador)</div>

var D = DATA;

function weekKeys() {
  var s = D.semanas || {};
  return Object.keys(s).sort(function(a,b){ return parseInt(a.replace(/\D/g,''),10)-parseInt(b.replace(/\D/g,''),10); });
}
function nSem(){ return (D.supuestos && D.supuestos.semanas) || weekKeys().length || 12; }
function fmtN(n){ n = Number(n)||0; return n.toLocaleString('es-CO',{maximumFractionDigits:0}); }
function linCls(l){ var n = String(l).replace(/\D/g,''); return 'c'+(n||'1'); }
function q(){ return (document.getElementById('q').value||'').toLowerCase().trim(); }
function fLin(){ return document.getElementById('f-lin').value; }
function fSem(){ return document.getElementById('f-sem').value; }
function matchQ(s){ var t=q(); return !t || String(s||'').toLowerCase().indexOf(t)!==-1; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
function shortMod(m){
  var s=String(m||'');
  s=s.replace(/\s*\(MAFE.*?Especial\)/i,'');
  s=s.replace(/\s*\(Especial\)/i,'');
  s=s.replace('MOTION LOOP ','ML ');
  s=s.replace('SHORT SPORT ','SS ');
  s=s.replace('VESTIDO ','V. ');
  return s.trim() || String(m);
}
function txCol(){ return _theme==='light'?'#1a1a2e':'#f0f0f5'; }
function bo(stacked){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{legend:{display:!!stacked, labels:{color:'#7a7b95', font:{family:'DM Sans', size:11}}}, tooltip:{backgroundColor:'#1e1f2b', borderColor:'#2a2b3a', borderWidth:1, titleFont:{family:'Syne', weight:'bold'}, bodyFont:{family:'DM Sans'}, padding:10}},
    scales:{
      x:{stacked:!!stacked, grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#7a7b95', font:{family:'DM Sans', size:11}}},
      y:{stacked:!!stacked, grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#7a7b95', font:{family:'DM Sans', size:11}}}
    }
  };
}
function mc(id,type,data,opts){
  if(CI[id]) try{ CI[id].destroy(); }catch(e){}
  var el=document.getElementById(id); if(!el) return null;
  CI[id]=new Chart(el.getContext('2d'),{type:type, data:data, options:opts});
  return CI[id];
}

function boot(){
  var n=nSem();
  document.getElementById('status').textContent = 'v'+(D.version||'')+' · Excel (16) · '+n+' semanas · Planificación / Semana 2–'+n+' / Proyección / Almacén';
  var lbl=document.getElementById('k-plan-lbl'); if(lbl) lbl.textContent='Plan '+n+' sem';
  document.getElementById('footVer').textContent = D.version||'';
  fillFilters();
  fillModelos();
  var m='';
  try{ m=(new URLSearchParams(location.search)).get('modelo')||''; }catch(e){}
  if(m){ setModelo(m); return; }
  kpis();
  renderAll();
}
function fillFilters(){
  var lin=document.getElementById('f-lin');
  var sem=document.getElementById('f-sem');
  (D.opcionesFiltro && D.opcionesFiltro.lineas || ['1','2','3','4','5']).forEach(function(l){
    var o=document.createElement('option'); o.value=String(l).replace(/\D/g,''); o.textContent='Línea '+o.value; lin.appendChild(o);
  });
  weekKeys().forEach(function(k,i){
    var o=document.createElement('option'); o.value=k;
    o.textContent = k + (D.fechasSemanas && D.fechasSemanas[k] ? ' ('+D.fechasSemanas[k]+')' : '');
    if(i===0) o.selected = true;
    sem.appendChild(o);
  });
}
function fillModelos(){
  var bar=document.getElementById('mbar');
  var mods=(D.opcionesFiltro && D.opcionesFiltro.modelos) || [];
  var html='<span class="mbar-lbl">Modelo:</span>';
  html+='<button class="mbtn active" data-m="" onclick="setModelo(\'\')">Todos <span class="mcnt" id="mcnt_all">0</span></button>';
  mods.forEach(function(m,i){
    html+='<button class="mbtn" data-m="'+esc(m)+'" onclick="setModelo(this.dataset.m)">'+esc(shortMod(m))+' <span class="mcnt" id="mcnt_'+i+'">0</span></button>';
  });
  bar.innerHTML=html;
  updateModeloCounts();
}
function updateModeloCounts(){
  var tot=0, by={};
  weekKeys().forEach(function(k){
    (D.semanas[k].carga||[]).forEach(function(c){
      var v=Number(c.total)||0; tot+=v; by[c.modelo]=(by[c.modelo]||0)+v;
    });
  });
  var el=document.getElementById('mcnt_all'); if(el) el.textContent=fmtN(tot);
  ((D.opcionesFiltro&&D.opcionesFiltro.modelos)||[]).forEach(function(m,i){
    var n=document.getElementById('mcnt_'+i); if(n) n.textContent=fmtN(by[m]||0);
  });
}
function primeraSemanaModelo(){
  if(!_modelo) return '';
  var keys=weekKeys();
  for(var i=0;i<keys.length;i++){
    var hay=cargaFiltrada(keys[i]).some(function(c){ return (Number(c.total)||0)>0; });
    if(hay) return keys[i];
  }
  return '';
}
function setModelo(m){
  _modelo=m||'';
  document.querySelectorAll('.mbtn').forEach(function(b){ b.classList.toggle('active', (b.dataset.m||'')===_modelo); });
  document.getElementById('titleModelo').textContent = _modelo ? shortMod(_modelo) : 'información';
  if(_modelo){
    var w=primeraSemanaModelo();
    if(w) document.getElementById('f-sem').value=w;
  }
  onFilter();
}
function fmtDiaHead(s){
  var p=String(s||'').split('/');
  var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  if(p.length>=2){
    var mes=meses[(parseInt(p[1],10)||1)-1]||p[1];
    return p[0]+' '+mes+(p[2]?' '+p[2]:'');
  }
  return s;
}
function kpis(){
  var plan=0; weekKeys().forEach(function(k){ cargaFiltrada(k).forEach(function(c){ plan+=Number(c.total)||0; }); });
  var pend=(D.pendientes||[]).reduce(function(a,p){ return a+(Number(p.cant)||0); },0);
  var alm=(D.almacenModelo||[]).filter(function(m){ return !_modelo || m.modelo===_modelo; }).reduce(function(a,p){ return a+(Number(p.cantidad)||0); },0);
  var nmod=_modelo?1:((D.proyModelo||[]).length);
  document.getElementById('k-plan').textContent=fmtN(plan);
  document.getElementById('k-pend').textContent=fmtN(pend);
  document.getElementById('k-alm').textContent=fmtN(alm);
  document.getElementById('k-mod').textContent=String(nmod);
}
function resetFilters(){ document.getElementById('q').value=''; document.getElementById('f-lin').value=''; document.getElementById('f-sem').selectedIndex=0; setModelo(''); }
function onFilter(){ kpis(); renderAll(); }
function renderAll(){
  renderCal(); renderSalida(); renderSeg(); renderPend(); renderAlm(); renderSup();
}

function cargaFiltrada(k){
  var lin=fLin();
  return (D.semanas[k]&&D.semanas[k].carga||[]).filter(function(c){
    if(_modelo && c.modelo!==_modelo) return false;
    if(lin && String(c.linea).replace(/\D/g,'')!==lin) return false;
    return matchQ(c.modelo);
  });
}

function renderCal(){
  var el=document.getElementById('sec-cal');
  var keys=weekKeys();
  var lines=['1','2','3','4','5'];
  var matrix={}; lines.forEach(function(l){ matrix[l]={}; keys.forEach(function(k){ matrix[l][k]=0; }); });
  var max=1, weekTot={};
  keys.forEach(function(k){
    weekTot[k]=0;
    cargaFiltrada(k).forEach(function(c){
      var l=String(c.linea).replace(/\D/g,'')||'?';
      if(!matrix[l]) matrix[l]={};
      matrix[l][k]=(matrix[l][k]||0)+(Number(c.total)||0);
      weekTot[k]+=Number(c.total)||0;
      if(matrix[l][k]>max) max=matrix[l][k];
    });
  });
  var planTot=keys.reduce(function(a,k){ return a+(weekTot[k]||0); },0);
  var sel=fSem()||keys[0];
  var dayTot=0;
  cargaFiltrada(sel).forEach(function(c){ dayTot+=Number(c.total)||0; });
  var tk='<div class="tkpis">';
  tk+='<div class="tkpi"><div class="tv">'+fmtN(planTot)+'</div><div class="tl">Pzas plan '+nSem()+' sem</div></div>';
  tk+='<div class="tkpi"><div class="tv">'+fmtN(weekTot[sel]||0)+'</div><div class="tl">'+sel+'</div></div>';
  tk+='<div class="tkpi"><div class="tv">'+fmtN(max)+'</div><div class="tl">Pico línea-semana</div></div>';
  tk+='<div class="tkpi"><div class="tv">5</div><div class="tl">Líneas</div></div></div>';

  var thead='<th>Línea</th>'+keys.map(function(k){ return '<th>'+k.replace('Semana','S')+'<br>'+(D.fechasSemanas[k]||'')+'</th>'; }).join('');
  var rows=lines.map(function(l){
    var tot=0;
    var tds=keys.map(function(k){
      var v=matrix[l][k]||0; tot+=v;
      var a=v/max;
      var bg='rgba(91,106,247,'+(v? (0.15+a*0.7):0.04)+')';
      return '<td><div class="heat" style="background:'+bg+'">'+(v?fmtN(v):'—')+'</div></td>';
    }).join('');
    return '<tr><td><span class="chip '+linCls(l)+'">'+l+'</span> Línea '+l+'</td>'+tds+'<td class="num">'+fmtN(tot)+'</td></tr>';
  }).join('');

  var fechas=(D.fechasDias&&D.fechasDias[sel])||[];
  var byLin={};
  cargaFiltrada(sel).forEach(function(c){
    var l=String(c.linea).replace(/\D/g,'');
    if(!byLin[l]) byLin[l]=[];
    byLin[l].push(c);
  });
  var gridHtml='<div class="cal-grid">';
  gridHtml+='<div></div>'+DIA_LBL.map(function(d,i){
    return '<div class="dayhead"><span class="dn">'+d+'</span>'+(fechas[i]?'<span class="dd">'+esc(fmtDiaHead(fechas[i]))+'</span>':'')+'</div>';
  }).join('');
  lines.forEach(function(l){
    gridHtml+='<div class="daycell"><span class="chip '+linCls(l)+'">'+l+'</span></div>';
    DIAS.forEach(function(d){
      var items=(byLin[l]||[]).filter(function(c){ return (c.dias&&c.dias[d])>0; });
      var bits=items.map(function(c){ return '<span class="pill">'+esc(shortMod(c.modelo))+' · '+fmtN(c.dias[d])+'</span>'; }).join(' ');
      var sum=items.reduce(function(a,c){ return a+(c.dias[d]||0); },0);
      gridHtml+='<div class="daycell">'+(sum? '<b>'+fmtN(sum)+' pzas</b>':'')+(bits||'<span class="sub">—</span>')+'</div>';
    });
  });
  gridHtml+='</div>';

  el.innerHTML=
    tk+
    '<div class="card"><h3>Calendario de producción</h3><p class="sub">Piezas por línea y semana. El detalle inferior es el día a día de la semana seleccionada.</p>'+
    '<div class="ctwrap"><table class="ct"><thead><tr>'+thead+'<th>Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3>Detalle diario · '+sel+(D.fechasSemanas[sel]?' ('+D.fechasSemanas[sel]+')':'')+'</h3>'+
    '<p class="sub">'+(_modelo?'Semana en la que inicia '+esc(shortMod(_modelo))+'. ':'')+'Qué modelo corre en cada línea y cuántas piezas salen ese día.</p>'+gridHtml+'</div>';
}

function renderSalida(){
  var el=document.getElementById('sec-salida');
  window._salidaCarga = {};
  var keys=weekKeys();
  var weekVals=keys.map(function(k){ return cargaFiltrada(k).reduce(function(a,c){ return a+(Number(c.total)||0); },0); });
  var html='<div class="card"><h3>Volumen por semana</h3><p class="sub">Total a fabricar según el plan (filtros aplicados).</p><div class="cw"><canvas id="cSalida"></canvas></div></div>';
  html+='<div class="card"><h3>Qué sale cada semana</h3><p class="sub">Drill-down semana → modelo (línea) → SKU. Las cantidades de SKU salen del desglose semanal de Proyeccion - SKUS.</p>';
  keys.forEach(function(k, wi){
    var carga=cargaFiltrada(k);
    var tot=carga.reduce(function(a,c){ return a+(Number(c.total)||0); },0);
    if(!tot && fLin()) return;
    html+='<div class="note expand" data-open="w'+wi+'" onclick="tog(this)">'+(k)+' · '+(D.fechasSemanas[k]||'')+' · <b>'+fmtN(tot)+'</b> pzas · '+carga.length+' modelos</div>';
    html+='<div id="w'+wi+'" style="display:none;margin:0 0 12px 8px">';
    html+='<table class="ct ct-mid"><thead><tr><th></th><th class="left">Modelo</th><th>Línea</th><th>MOs</th><th>Solicitada</th><th>A fabricar</th></tr></thead><tbody>';
    carga.forEach(function(c, mi){
      var id='w'+wi+'m'+mi;
      html+='<tr class="tr-exp" onclick="togSku(\''+id+'\','+wi+','+mi+')"><td><span class="chev">▸</span></td><td class="left">'+esc(c.modelo)+'</td><td><span class="chip '+linCls(c.linea)+'">'+String(c.linea).replace(/\D/g,'')+'</span></td><td class="num">'+fmtN(c.mos)+'</td><td class="num">'+fmtN(c.solicitada)+'</td><td class="num">'+fmtN(c.total)+'</td></tr>';
      html+='<tr id="'+id+'" class="sku-row" style="display:none"><td colspan="6">Cargando SKUs…</td></tr>';
    });
    html+='</tbody></table></div>';
    window._salidaCarga[wi]=carga;
  });
  html+='</div>';
  el.innerHTML=html;
  mc('cSalida','bar',{
    labels: keys.map(function(k){ return k.replace('Semana','S'); }),
    datasets: [{label:'Pzas', data: weekVals, backgroundColor:'#5b6af7', borderRadius:6}]
  }, bo(false));
}
window.tog=function(n){ n.classList.toggle('open'); var t=document.getElementById(n.getAttribute('data-open')); if(t) t.style.display=t.style.display==='none'?'block':'none'; };
window.togSku=function(id, wi, mi){
  var row=document.getElementById(id);
  if(!row) return;
  if(row.style.display!=='none' && row.getAttribute('data-ok')){ row.style.display='none'; return; }
  var c=(window._salidaCarga[wi]||[])[mi]||{};
  var modelo=c.modelo;
  var skus=(D.proySku||[]).filter(function(s){ return s.modelo===modelo && matchQ(s.sku+s.detalle) && (Number((s.weeks||[])[wi])||0)>0; });
  if(!skus.length){ row.innerHTML='<td colspan="6" class="sub">Sin SKUs con cantidad en esta semana.</td>'; }
  else {
    var t='<td colspan="6"><table class="ct ct-mid"><thead><tr><th class="left">SKU</th><th class="left">Detalle</th><th>Color</th><th>Talla</th><th>Cant. semana</th><th>Meta</th></tr></thead><tbody>';
    skus.forEach(function(s){ t+='<tr><td class="left">'+esc(s.sku)+'</td><td class="left">'+esc(s.detalle)+'</td><td>'+esc(s.color)+'</td><td>'+esc(s.talla)+'</td><td class="num">'+fmtN((s.weeks||[])[wi])+'</td><td class="num">'+fmtN(s.meta)+'</td></tr>'; });
    t+='</tbody></table></td>';
    row.innerHTML=t;
  }
  row.setAttribute('data-ok','1');
  row.style.display='table-row';
};

function primerDiaCarga(c){
  for(var i=0;i<DIAS.length;i++){
    if(c.dias && (Number(c.dias[DIAS[i]])||0)>0) return i;
  }
  return 99;
}
function renderSeg(){
  var el=document.getElementById('sec-seg');
  var keys=weekKeys();
  var map={};
  var seq=0;
  keys.forEach(function(k, wi){
    cargaFiltrada(k).forEach(function(c){
      var l=String(c.linea).replace(/\D/g,'');
      if(!map[c.modelo]){
        map[c.modelo]={weeks:keys.map(function(){ return []; }), tot:0, ord:[wi, primerDiaCarga(c), parseInt(l,10)||9, seq]};
      }
      seq++;
      if(map[c.modelo].weeks[wi].indexOf(l)<0) map[c.modelo].weeks[wi].push(l);
      map[c.modelo].tot += Number(c.total)||0;
    });
  });
  var mods=Object.keys(map).sort(function(a,b){
    var A=map[a].ord, B=map[b].ord;
    for(var i=0;i<A.length;i++){ if(A[i]!==B[i]) return A[i]-B[i]; }
    return a.localeCompare(b,'es');
  });
  var head='<th class="prod">Producto</th>'+keys.map(function(k){ return '<th>'+k.replace('Semana','S')+'<br>'+(D.fechasSemanas[k]||'')+'</th>'; }).join('');
  var body=mods.map(function(m, i){
    var cells=map[m].weeks.map(function(ls){
      if(!ls.length) return '<td></td>';
      ls=ls.slice().sort(function(a,b){ return (parseInt(a,10)||0)-(parseInt(b,10)||0); });
      var dots=ls.map(function(l){ return '<span class="chip '+linCls(l)+'" title="Línea '+l+'">'+l+'</span>'; }).join('');
      return '<td><div class="tl-dots">'+dots+'</div></td>';
    }).join('');
    return '<tr class="tr-exp" onclick="togSeg('+i+')"><td class="prod"><span class="chev">▸</span> '+esc(m)+'</td>'+cells+'</tr><tr id="seg-'+i+'" style="display:none"><td colspan="'+(keys.length+1)+'" class="sku-row"></td></tr>';
  }).join('');
  var legend=['1','2','3','4','5'].map(function(l){ return '<span class="chip '+linCls(l)+'">'+l+'</span> Línea '+l; }).join(' &nbsp; ');
  el.innerHTML='<div class="card"><h3>Seguimiento de modelos y líneas</h3><p class="sub">Ordenados por el flujo del plan: primero quien arranca. Cada punto es la línea de esa semana. Clic en el modelo para ver SKUs.</p><div style="margin-bottom:10px;font-size:.75rem;color:var(--mu)">'+legend+'</div><div class="ctwrap"><table class="tl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  window._segMods=mods;
}
window.togSeg=function(i){
  var row=document.getElementById('seg-'+i);
  if(!row) return;
  var open=row.style.display!=='none';
  if(open){ row.style.display='none'; return; }
  var m=window._segMods[i];
  var keys=weekKeys();
  var skus=(D.proySku||[]).filter(function(s){ return s.modelo===m && matchQ(s.sku+s.detalle); });
  var h='<table class="ct"><thead><tr><th>SKU</th>'+keys.map(function(k){ return '<th>'+k.replace('Semana','S')+'</th>'; }).join('')+'<th>Meta</th></tr></thead><tbody>';
  skus.forEach(function(s){
    h+='<tr><td>'+esc(s.sku)+' <span class="sub">'+esc(s.color)+' '+esc(s.talla)+'</span></td>';
    (s.weeks||[]).forEach(function(v){ h+='<td class="num">'+(v?fmtN(v):'')+'</td>'; });
    h+='<td class="num">'+fmtN(s.meta)+'</td></tr>';
  });
  h+='</tbody></table>';
  row.children[0].innerHTML=h;
  row.style.display='table-row';
};

function renderPend(){
  var el=document.getElementById('sec-pend');
  var rows=(D.pendientes||[]).filter(function(p){
    if(_modelo && String(p.producto||'').toLowerCase().indexOf(_modelo.toLowerCase())<0) return false;
    if(q() && !matchQ(p.producto+p.sku+p.mo+p.para)) return false;
    return true;
  });
  var fuera=rows.filter(function(p){ return /fuera|sin capacidad/i.test(p.para||''); });
  var despues=rows.filter(function(p){ return !/fuera|sin capacidad/i.test(p.para||''); });
  var vDes=despues.reduce(function(a,p){return a+(Number(p.cant)||0);},0);
  var vFue=fuera.reduce(function(a,p){return a+(Number(p.cant)||0);},0);
  var html='<div class="g2"><div class="card"><h3>Más adelante en el horizonte</h3><p class="sub">Ya tienen semana asignada (Semana 2–'+nSem()+').</p><div style="font-family:var(--fh);font-size:1.4rem;font-weight:800;color:var(--ac)">'+fmtN(vDes)+'</div><div class="sub">'+despues.length+' MOs</div><h3 style="margin-top:16px">Sin programar / fuera de horizonte</h3><p class="sub">No cupieron en las '+nSem()+' semanas o no hay línea.</p><div style="font-family:var(--fh);font-size:1.4rem;font-weight:800;color:var(--a2)">'+fmtN(vFue)+'</div><div class="sub">'+fuera.length+' MOs</div></div>';
  html+='<div class="card"><h3>Mix de pendientes</h3><p class="sub">En horizonte vs fuera / sin programar.</p><div class="cw t"><canvas id="cPend"></canvas></div></div></div>';
  var sin=(D.proyModelo||[]).filter(function(m){ return (m.sin||0)>0 && matchQ(m.modelo) && (!_modelo || m.modelo===_modelo); });
  if(sin.length){
    html+='<div class="card"><h3>Modelos con piezas sin programar (Proyección)</h3><table class="ct ct-mid"><thead><tr><th class="left">Modelo</th><th>Meta</th><th>Sin programar</th><th>Estado</th></tr></thead><tbody>';
    sin.forEach(function(m){ html+='<tr><td class="left">'+esc(m.modelo)+'</td><td class="num">'+fmtN(m.meta)+'</td><td class="num">'+fmtN(m.sin)+'</td><td>'+esc(m.estado)+'</td></tr>'; });
    html+='</tbody></table></div>';
  }
  var sinPlan=(D.modelosSinPlanificar||[]).filter(function(m){
    if(_modelo && m.modelo!==_modelo) return false;
    return matchQ(m.modelo+(m.tipo||''));
  });
  var vSinPlan=sinPlan.reduce(function(a,m){ return a+(Number(m.faltante)||0); },0);
  html+='<div class="card"><h3>Modelos sin planificar</h3><p class="sub">Están en Priorización sin prioridad, sin fecha de salida estimada y sin línea. Cantidades de Por Hacer.</p>';
  html+='<div style="font-family:var(--fh);font-size:1.2rem;font-weight:800;color:var(--a2);margin-bottom:10px">'+fmtN(vSinPlan)+' <span class="sub">pzas · '+sinPlan.length+' modelos</span></div>';
  html+='<table class="ct ct-mid"><thead><tr><th class="left">Modelo</th><th>Tipo</th><th>MOs</th><th>Solicitada</th><th>Faltante</th></tr></thead><tbody>';
  if(!sinPlan.length){
    html+='<tr><td colspan="5" class="sub">No hay modelos sin planificar.</td></tr>';
  } else {
    sinPlan.forEach(function(m){
      html+='<tr><td class="left">'+esc(m.modelo)+'</td><td>'+esc(m.tipo||'')+'</td><td class="num">'+fmtN(m.mos)+'</td><td class="num">'+fmtN(m.solicitada)+'</td><td class="num">'+fmtN(m.faltante)+'</td></tr>';
    });
  }
  html+='</tbody></table></div>';
  el.innerHTML=html;
  mc('cPend','doughnut',{
    labels:['En horizonte','Fuera / sin programar'],
    datasets:[{data:[vDes,vFue], backgroundColor:['#5b6af7','#f75b8a'], borderWidth:0}]
  }, {responsive:true, maintainAspectRatio:false, animation:false, plugins:{legend:{position:'bottom', labels:{color:'#7a7b95', font:{family:'DM Sans', size:11}}}}});
}

function renderAlm(){
  var el=document.getElementById('sec-alm');
  var mods=(D.almacenModelo||[]).filter(function(m){ return matchQ(m.modelo) && (!_modelo || m.modelo===_modelo); });
  var skus=D.almacenSku||[];
  var html='<div class="card"><h3>Entrada de almacén</h3><p class="sub">Lead time: '+(D.supuestos&&D.supuestos.leadTimeAlmacenDias||4)+' días hábiles después de salir de costura. Clic en el modelo para ver SKUs.</p>';
  html+='<div class="ctwrap"><table class="ct ct-mid"><thead><tr><th></th><th class="left">Modelo</th><th>MOs</th><th>Cantidad</th><th>Sale costura</th><th>Entra almacén</th></tr></thead><tbody>';
  mods.forEach(function(m,i){
    html+='<tr class="tr-exp" onclick="togAlm('+i+')"><td><span class="chev">▸</span></td><td class="left">'+esc(m.modelo)+'</td><td class="num">'+fmtN(m.mos)+'</td><td class="num">'+fmtN(m.cantidad)+'</td><td>'+esc(m.salidaCostura)+'</td><td>'+esc(m.entradaAlmacen)+'</td></tr>';
    html+='<tr id="alm-'+i+'" style="display:none"><td colspan="6" class="sku-row"></td></tr>';
  });
  html+='</tbody></table></div></div>';
  el.innerHTML=html;
  window._almMods=mods;
  window._almSkus=skus;
}
window.togAlm=function(i){
  var row=document.getElementById('alm-'+i); if(!row) return;
  if(row.style.display!=='none'){ row.style.display='none'; return; }
  var m=window._almMods[i].modelo;
  var parts=skusDeModeloAlm(m);
  var h='<table class="ct ct-mid"><thead><tr><th>MO</th><th class="left">SKU</th><th class="left">Producto</th><th>Cant.</th><th>Sale costura</th><th>Entra almacén</th></tr></thead><tbody>';
  parts.forEach(function(s){ h+='<tr><td>'+esc(s.mo)+'</td><td class="left">'+esc(s.sku)+'</td><td class="left">'+esc(s.producto)+'</td><td class="num">'+fmtN(s.cantidad)+'</td><td>'+esc(s.salidaCostura)+'</td><td>'+esc(s.entradaAlmacen)+'</td></tr>'; });
  h+='</tbody></table>';
  row.children[0].innerHTML=h||'<span class="sub">Sin SKUs</span>';
  row.style.display='table-row';
};
function skusDeModeloAlm(modelo){
  var set={};
  (D.proySku||[]).forEach(function(s){ if(s.modelo===modelo) set[s.sku]=1; });
  return (D.almacenSku||[]).filter(function(s){
    if(_modelo && s.modelo && s.modelo!==modelo && String(s.producto||'').toLowerCase().indexOf(String(modelo||'').toLowerCase())<0) {
      /* keep matching logic below */
    }
    if(set[s.sku]) return true;
    return String(s.producto||'').toLowerCase().indexOf(String(modelo||'').toLowerCase())!==-1;
  });
}

function renderSup(){
  var s=D.supuestos||{};
  var caps=s.capsModelo||{};
  var fb=s.capFallback||{};
  var html='<div class="g2">';
  html+='<div class="card"><h3>Capacidad y horizonte</h3><p class="sub">Reglas con las que se armó el plan.</p>';
  html+='<table class="ct"><tbody>';
  html+='<tr><td>Horizonte</td><td class="num">'+(s.semanas||10)+' semanas · '+(s.diasLaborales||5)+' días hábiles</td></tr>';
  html+='<tr><td>Lead time costura → almacén</td><td class="num">'+(s.leadTimeAlmacenDias||4)+' días hábiles</td></tr>';
  html+='<tr><td>Apoyo Línea 1</td><td class="num">'+Math.round((s.apoyoL1Fraccion||0.5)*100)+'% de L1 al modelo de L2</td></tr>';
  html+='<tr><td>Remanente corto L2</td><td class="num">cede si quedan &lt; '+(s.remanenteCortoL2Dias||2)+' días</td></tr>';
  html+='<tr><td>Línea 5 en paralelo</td><td class="num">máx. '+(s.maxModelosLinea5||2)+' familias</td></tr>';
  html+='<tr><td>Techo si no hay cap en el modelo</td><td class="num">L1–4 = '+(fb['1']||130)+' · L5 = '+(fb['5']||40)+'</td></tr>';
  html+='</tbody></table></div>';
  html+='<div class="card"><h3>Reajustes mayores</h3><p class="sub">Este HTML no cambia el plan; lo lee.</p>';
  (s.notas||[]).forEach(function(n){ html+='<div class="note">'+esc(n)+'</div>'; });
  html+='</div></div>';
  html+='<div class="card"><h3>Capacidad de producción por modelo</h3><p class="sub">Cap Produccion por Dia tomada de Proyeccion - SKUS.</p><table class="ct ct-mid"><thead><tr><th class="left">Modelo</th><th>Pzas / día</th></tr></thead><tbody>';
  Object.keys(caps).sort().forEach(function(m){
    if(!matchQ(m)) return;
    if(_modelo && m!==_modelo) return;
    html+='<tr><td class="left">'+esc(m)+'</td><td class="num">'+fmtN(caps[m])+'</td></tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById('sec-sup').innerHTML=html;
}

function toggleTheme(){
  _theme=_theme==='dark'?'light':'dark';
  document.body.classList.toggle('light', _theme==='light');
  document.getElementById('themeBtn').innerHTML=_theme==='dark'?'☀️ Light':'🌙 Dark';
  renderAll();
}
function csvEsc(v){ var s=String(v==null?'':v); if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"'; return s; }
function downloadCSV(name, rows){
  var txt=rows.map(function(r){ return r.map(csvEsc).join(','); }).join('\n');
  var blob=new Blob(['\ufeff'+txt], {type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
function exportCSV(){
  var keys=weekKeys();
  if(_tab==='cal' || _tab==='salida'){
    var rows=[['Semana','Fecha','Linea','Modelo','MOs','Solicitada','A fabricar','Lunes','Martes','Miercoles','Jueves','Viernes']];
    keys.forEach(function(k){
      cargaFiltrada(k).forEach(function(c){
        var d=c.dias||{};
        rows.push([k, D.fechasSemanas[k]||'', c.linea, c.modelo, c.mos, c.solicitada, c.total, d.lunes||0, d.martes||0, d.miercoles||0, d.jueves||0, d.viernes||0]);
      });
    });
    downloadCSV('planificacion-calendario.csv', rows);
  } else if(_tab==='pend'){
    var rows=[['Seccion','Modelo','Tipo','MOs','Solicitada','Faltante','Meta','Sin programar','Estado']];
    (D.proyModelo||[]).filter(function(m){ return (m.sin||0)>0; }).forEach(function(m){
      rows.push(['Sin programar', m.modelo, '', '', '', '', m.meta, m.sin, m.estado]);
    });
    (D.modelosSinPlanificar||[]).forEach(function(m){
      rows.push(['Sin planificar', m.modelo, m.tipo||'', m.mos, m.solicitada, m.faltante, '', '', '']);
    });
    downloadCSV('planificacion-pendientes.csv', rows);
  } else if(_tab==='alm'){
    var rows=[['MO','SKU','Producto','Modelo','Cantidad','Sale costura','Entra almacen']];
    (D.almacenSku||[]).forEach(function(s){ rows.push([s.mo,s.sku,s.producto,s.modelo,s.cantidad,s.salidaCostura,s.entradaAlmacen]); });
    downloadCSV('planificacion-almacen.csv', rows);
  } else if(_tab==='sup'){
    var rows=[['Modelo','Cap pzas/dia']];
    var caps=(D.supuestos&&D.supuestos.capsModelo)||{};
    Object.keys(caps).sort().forEach(function(m){ rows.push([m, caps[m]]); });
    downloadCSV('planificacion-capacidad.csv', rows);
  } else {
    var rows=[['Modelo'].concat(keys)];
    (window._segMods||[]).forEach(function(m){ rows.push([m].concat(keys.map(function(){ return ''; }))); });
    downloadCSV('planificacion-seguimiento.csv', rows);
  }
}

function paintTab(){
  if(_tab==='cal') renderCal();
  else if(_tab==='salida') renderSalida();
  else if(_tab==='seg') renderSeg();
  else if(_tab==='pend') renderPend();
  else if(_tab==='alm') renderAlm();
  else if(_tab==='sup') renderSup();
}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.sec').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    _tab=b.getAttribute('data-tab');
    document.getElementById('sec-'+_tab).classList.add('active');
    try { history.replaceState(null,'','#'+_tab); } catch(e) {}
    paintTab();
  });
});
(function(){
  var h=(location.hash||'').replace('#','');
  if(h){
    var b=document.querySelector('.tab[data-tab="'+h+'"]');
    if(b) b.click();
  }
})();
boot();
