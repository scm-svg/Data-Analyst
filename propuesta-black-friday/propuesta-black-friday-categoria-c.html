<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",sans-serif;font-size:15px;line-height:1.45}
button,input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
header h1{font-family:Fraunces,serif;font-weight:560;font-size:2.15rem;letter-spacing:-.03em;margin:0 0 6px}

.rec p{margin:0;font-size:.98rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 18px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:inherit}
.opt.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.opt .tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opt .tag.g{color:var(--green)} .opt .tag.a{color:var(--amber)}
.opt h2{font-family:Fraunces,serif;font-size:1.45rem;margin:4px 0 6px;font-weight:560}
.opt .frase{color:var(--muted);font-size:.9rem;min-height:2.7em}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metrics div{background:var(--bg);border-radius:10px;padding:8px 10px}
.metrics .n{font-weight:700;font-size:1.05rem}
.metrics .l{font-size:.72rem;color:var(--muted)}
.ladder{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.lad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:120px}
.lad b{display:block;font-family:Fraunces,serif;font-size:1.25rem}
.lad span{color:var(--muted);font-size:.75rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none} .panel.on{display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);max-height:640px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;position:sticky;top:0;background:#faf7f1;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #eee7dc;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf8f2}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:700;background:var(--chip)}
.pill.rose{background:#fde8ef;color:var(--rose)}
.pill.green{background:var(--green2);color:var(--green)}
.pill.amber{background:var(--amber2);color:var(--amber)}
.subrow td{background:#faf7f1;font-size:.8rem;color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.note h3{margin:0 0 6px;font-size:1rem}
.note p{margin:0;color:var(--muted);font-size:.9rem}
.call{background:#fff6ea;border:1px solid #f0ddb8;border-radius:14px;padding:12px 14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.bars{display:flex;flex-direction:column;gap:7px}
.barline{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:.8rem}
.track{background:#efeae0;border-radius:99px;height:10px;overflow:hidden}
.track span{display:block;height:100%;background:var(--rose);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .n{font-family:Fraunces,serif;font-size:1.4rem}
.kpi .l{color:var(--muted);font-size:.75rem}
footer{margin-top:28px;color:var(--muted);font-size:.78rem}
@media(max-width:860px){.cards,.grid2,.kpis{grid-template-columns:1fr}}
</style>

const state = { op: DATA.recomendacion.id, tab: "lista", q: "", macro: "", rango: "", open: null };

const ESTADO = {
  estable: "Ritmo parejo",

  enfriando: "Se enfrió",
  frenado: "Paró este trimestre",
  "sin salida": "Sin venta en el año",
  dormido: "Sin salida reciente"
};
const RANGO = {
  "6-12": "6 a 12 meses",
  "12-18": "12 a 18 meses",
  "18-24": "18 a 24 meses",

};

function money(n){
  if(n==null || isNaN(n)) return "—";
  return n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
}
function num(n, d){
  if(n==null || isNaN(n)) return "—";
  return Number(n).toLocaleString("es-VE",{maximumFractionDigits:d??0});
}
function pct(n){
  if(n==null || isNaN(n)) return "—";
  return (n*100).toLocaleString("es-VE",{maximumFractionDigits:0})+"%";
}
function esc(s){return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function op(){ return DATA.opciones[state.op]; }

function render(){
  const m = DATA.meta;
  document.getElementById("lead").textContent =
    "Propuesta para directiva. Solo manufactura y equipamiento que son cola de margen y cola de rotación: el 5% final de cada una. Período "+m.periodo+". El objetivo es subir la salida de lo que hoy no rota, y dejar la tienda abastecida antes del evento.";
  document.getElementById("recText").textContent = DATA.recomendacion.texto;
  document.getElementById("recTag").textContent = "Recomendación · "+DATA.opciones[DATA.recomendacion.id].nombre;
  renderCards();
  renderLadder();
  renderLista();
  renderAbasto();
  renderFuera();
  renderCriterio();
  document.getElementById("foot").textContent =
    "Precios y costos: promedio del dashboard ABC. Ventas e inventario: cuadros actualizados de esta propuesta. Pedidos y Corporativo no entran al ritmo. CHACAO = Sambil Chacao, SAMBIL = Sambil Valencia.";
}

function renderCards(){
  const box = document.getElementById("cards");
  box.innerHTML = "";
  ["impulso","desatasco"].forEach(id=>{
    const o = DATA.opciones[id];
    const r = o.resumen;
    const el = document.createElement("button");
    el.className = "opt"+(state.op===id?" on":"");
    el.type = "button";
    const rec = DATA.recomendacion.id===id;
    el.innerHTML =
      '<div class="tag '+(id==="impulso"?"g":"a")+'">'+(rec?"Recomendada":"Alternativa")+'</div>'+
      '<h2>'+esc(o.nombre)+'</h2>'+
      '<div class="frase">'+esc(o.frase)+'</div>'+
      '<div class="metrics">'+
        metric(num(r.modelos), "modelos")+
        metric(num(r.unidades), "unidades")+
        metric(money(r.costo), "capital a costo")+
        metric(money(r.capital6), "sobra sobre 6 meses")+
        metric(pct(r.desc_efectivo), "descuento efectivo")+
        metric(pct(r.margen_conservado), "margen que se conserva")+
        metric(money(r.costo_mes), "se entrega en 1 mes normal")+
        metric(num(r.bajar), "bajar de taller")+
      "</div>";
    el.onclick = ()=>{ state.op=id; state.open=null; render(); };
    box.appendChild(el);
  });
}
function metric(n,l){return '<div><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}

function renderLadder(){
  const box = document.getElementById("ladder");
  box.innerHTML = "";
  op().tiers.forEach(t=>{
    const d = document.createElement("div");
    d.className = "lad";
    const models = DATA.modelos.filter(m=>m[state.op] && m.rango===t.id);
    const cost = models.reduce((s,m)=>s+(m.costo||0),0);
    d.innerHTML = "<b>"+pct(t.pct)+"</b><span>"+esc(t.label)+"<br>"+models.length+" modelos · "+money(cost)+"</span>";
    box.appendChild(d);
  });
}

function modelsNow(){
  return DATA.modelos.filter(m=>{
    if(!m[state.op]) return false;
    if(state.macro && m.macro!==state.macro) return false;
    if(state.rango && m.rango!==state.rango) return false;
    if(state.q){
      const blob = (m.modelo+" "+m.categoria).toLowerCase();
      if(!blob.includes(state.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=>(b.costo||0)-(a.costo||0));
}

function renderLista(){
  const rows = modelsNow();
  const panel = document.getElementById("panel-lista");
  const rangos = op().tiers.map(t=>'<option value="'+t.id+'">'+esc(t.label)+'</option>').join("");
  let html = '<div class="filters">'+
    '<input id="q" placeholder="Buscar modelo" value="'+esc(state.q)+'">'+

    '<th>Modelo</th><th>Línea</th><th>Situación</th><th class="num">Cobertura</th><th class="num">Stock</th><th class="num">Taller</th><th class="num">Descuento</th><th class="num">Precio BF</th><th class="num">Capital</th>'+
    '</tr></thead><tbody>';
  rows.forEach(m=>{
    const d = state.op==="impulso" ? m.dI : m.dD;
    const precio = state.op==="impulso" ? m.pvpI : m.pvpD;
    const tope = state.op==="impulso" ? m.topeI : m.topeD;
    const cover = m.cover==null ? "Sin salida" : (m.cover>=120 ? "120+ meses" : num(m.cover,1)+" meses");
    const clase = m.clase==="B" ? ' <span class="pill amber">Clase B</span>' : "";
    html += '<tr class="click" data-modelo="'+esc(m.modelo)+'">'+
      '<td><b>'+esc(m.modelo)+'</b>'+clase+'<div style="color:var(--muted);font-size:.75rem">'+esc(m.categoria)+'</div></td>'+
      '<td>'+esc(m.macro)+'</td>'+
      '<td><span class="pill '+(m.rango==="dormido"||m.rango==="24+"?"rose":"")+'">'+esc(ESTADO[m.estado]||m.estado)+'</span></td>'+
      '<td class="num">'+cover+'</td>'+
      '<td class="num">'+num(m.stock)+'</td>'+
      '<td class="num">'+num(m.taller)+'</td>'+
      '<td class="num"><b>'+pct(d)+'</b>'+(tope?'<div style="color:var(--amber);font-size:.72rem">tope de costo</div>':'')+'</td>'+
      '<td class="num">'+money(precio)+'</td>'+
      '<td class="num">'+money(m.costo)+'</td></tr>';
    if(state.open===m.modelo){
      const lines = DATA.lineas.filter(x=>x.modelo===m.modelo && (state.op==="desatasco"?x.dD!=null:x.dI!=null));
      html += '<tr class="subrow"><td colspan="9">'+lines.map(x=>{
        const dd = state.op==="impulso"?x.dI:x.dD;
        const promo = x.precio*(1-dd);
        return esc([x.gen,x.color,x.talla].filter(Boolean).join(" · ")||x.sku)+
          ' · '+esc(x.sku)+' · stock '+num(x.stock)+' (taller '+num(x.taller)+') · '+
          money(x.precio)+' → '+money(promo)+' ('+pct(dd)+')';
      }).join("<br>")+'</td></tr>';
    }
  });
  html += '</tbody></table></div>';
  html += '<p class="lead" style="margin-top:8px">Clic en un modelo para ver talla, color y precio de cada SKU. El descuento del modelo es el efectivo, ponderado por inventario. Si dice tope de costo, algún SKU no aguantaba el porcentaje de la escalera sin quedar por debajo de costo × 1,10.</p>';
  const keepFocus = document.activeElement && document.activeElement.id === "q";
  panel.innerHTML = html;
  const q = panel.querySelector("#q");
  const macro = panel.querySelector("#macro");
  const rango = panel.querySelector("#rango");
  macro.value = state.macro; rango.value = state.rango;
  q.oninput = ()=>{ state.q = q.value; renderLista(); };
  if (keepFocus) {
    q.focus();
    const p = q.value.length;
    q.setSelectionRange(p, p);
  }
  macro.onchange = ()=>{ state.macro = macro.value; renderLista(); };
  rango.onchange = ()=>{ state.rango = rango.value; renderLista(); };
  panel.querySelectorAll("tr.click").forEach(tr=>{
    tr.onclick = ()=>{
      const id = tr.getAttribute("data-modelo");
      state.open = state.open===id?null:id;
      renderLista();
    };
  });
}

    'B · '+c.B.modelos+' modelos · '+share("B")+' del margen<br>'+
    'C · '+c.C.modelos+' modelos · '+share("C")+' del margen</p></div>'+
    '<div class="note"><h3>Matriz margen × rotación</h3><p>Filas: margen. Columnas: rotación. La campaña vive en C–C. Las casillas C–A y C–B son las que se ven grandes en inventario y no se descuentan.</p>'+
    matriz()+'</div></div>'+
    '<div class="note"><h3>Decisiones que cambian el resultado, y por qué se tomaron</h3>'+
    '<p>1. El ritmo es de tienda y web ('+num(m.unidadesConsumo)+' unidades). Pedidos y Corporativo suman '+num(m.unidadesMayor)+' y quedan fuera: son bultos, no rotación de piso.</p>'+
    '<p>2. La cobertura no usa a ciegas el promedio de 12 meses. Si el trimestre repuntó, se usa ese ritmo. Si se cayó a menos de la mitad, también. Así no se descuenta un producto que acaba de despertar, y sí se empuja uno que se apagó.</p>'+
    '<p>3. El precio promo no baja de costo × 1,10. El porcentaje de la escalera se recorta de cinco en cinco cuando el margen no da.</p>'+
    '<p>4. “Se entrega en un mes normal” es el margen que se pierde si noviembre vende lo mismo que un mes reciente, pero con descuento. No es un pronóstico de Black Friday. “Margen de lo que sobra” es lo que aún dejan las unidades por encima de 6 meses de cobertura, vendidas a precio promo.</p>'+
    '<p>5. Hay modelos sin precio en el ABC. Se muestran aparte. No se les inventa descuento.</p></div>'+
    (DATA.top?'<div class="call"><b>'+esc(DATA.top.modelo)+'</b> concentra '+money(DATA.top.costo)+' del capital de la lista ('+esc(DATA.top.macro)+'). Conviene mirarlo solo antes de aprobar el porcentaje del tramo.</div>':'');
}
function matriz(){
  const order=["A","B","C"];
  let h='<table style="margin-top:8px"><thead><tr><th></th><th>Rotación A</th><th>Rotación B</th><th>Rotación C</th></tr></thead><tbody>';
  order.forEach(a=>{
    h+='<tr><td>Margen '+a+'</td>';
    order.forEach(b=>{
      const n = DATA.meta.matriz[a+b]||0;
      const hot = a==="C" && b==="C";
      h+='<td class="num">'+(hot?'<b>'+n+'</b>':n)+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

document.getElementById("tabs").onclick = (e)=>{
  const b = e.target.closest("button");
  if(!b) return;
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-"+state.tab));
};
render();
</script>
