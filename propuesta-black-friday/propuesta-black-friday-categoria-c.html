<style>
:root{
  --bg:#f3f0e8; --ink:#1c1915; --muted:#5e584e; --line:#ddd6c8;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",sans-serif;font-size:15px;line-height:1.45}
button,input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
header h1{font-family:Fraunces,serif;font-weight:560;font-size:2.15rem;letter-spacing:-.03em;margin:0 0 6px}
header h1 em{font-style:italic;color:var(--rose)}
.lead{color:var(--muted);max-width:820px;margin:0}
.rec{margin:22px 0 14px;background:var(--green);color:#f4fff9;border-radius:16px;padding:16px 18px}
.rec b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.rec p{margin:0;font-size:.98rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:inherit}
.opt.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.opt .tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opt .tag.g{color:var(--green)} .opt .tag.a{color:var(--amber)}
.opt h2{font-family:Fraunces,serif;font-size:1.45rem;margin:4px 0 6px;font-weight:560}
.opt .frase{color:var(--muted);font-size:.9rem;min-height:2.7em}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metrics div{background:var(--bg);border-radius:10px;padding:8px 10px}
.metrics .n{font-weight:700;font-size:1.05rem}
.metrics .l{font-size:.72rem;color:var(--muted)}
.foco{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.foco button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;color:inherit;min-width:150px}
.foco button:hover{border-color:var(--green)}
.foco b{display:block;font-size:.92rem}
.foco span{color:var(--muted);font-size:.75rem}
.ladder{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.lad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:128px}
.lad b{display:block;font-family:Fraunces,serif;font-size:1.25rem}
.lad span{color:var(--muted);font-size:.75rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none} .panel.on{display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);max-height:640px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;position:sticky;top:0;background:#faf7f1;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #eee7dc;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf8f2}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:700;background:var(--chip)}
.pill.rose{background:#fde8ef;color:var(--rose)}
.pill.green{background:var(--green2);color:var(--green)}
.pill.amber{background:var(--amber2);color:var(--amber)}
.subrow td{background:#faf7f1;font-size:.8rem;color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.note h3{margin:0 0 6px;font-size:1rem}
.note p{margin:0;color:var(--muted);font-size:.9rem}
.call{background:#fff6ea;border:1px solid #f0ddb8;border-radius:14px;padding:12px 14px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.bars{display:flex;flex-direction:column;gap:7px}
.barline{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:.8rem}
.track{background:#efeae0;border-radius:99px;height:10px;overflow:hidden}
.track span{display:block;height:100%;background:var(--rose);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .n{font-family:Fraunces,serif;font-size:1.4rem}
.kpi .l{color:var(--muted);font-size:.75rem}
footer{margin-top:28px;color:var(--muted);font-size:.78rem}
@media(max-width:860px){.cards,.grid2,.kpis{grid-template-columns:1fr} .barline{grid-template-columns:1fr}}
</style>
</head>

const state = { op: DATA.recomendacion.id, tab: "lista", q: "", macro: "", rango: "", origen: "", open: null };

const RANGO = {
  "<6": "Menos de 6 meses",
  "6-12": "6 a 12 meses",
  "12-18": "12 a 18 meses",
  "18-24": "18 a 24 meses",
  "24+": "Más de 24 meses",
  dormido: "Sin salida en el año"
};

function num(n, d){
  if(n==null || isNaN(n)) return "—";
  return Number(n).toLocaleString("es-VE",{maximumFractionDigits:d??0});
}
function money(n){
  if(n==null || isNaN(n)) return "—";
  return n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2});
}
function pct(n){
  if(n==null || isNaN(n)) return "—";
  return (n*100).toLocaleString("es-VE",{maximumFractionDigits:0})+"%";
}
function esc(s){return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function coverTxt(c){
  if(c==null) return "Sin salida";
  if(c>=120) return "120+ meses";
  return num(c,1)+" meses";
}
function op(){ return DATA.opciones[state.op]; }
function metric(n,l){return '<div><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}

function render(){
  const m = DATA.meta;
  const r = DATA.resumen;
  document.getElementById("lead").textContent =
    "Propuesta para directiva. Manufactura y equipamiento de baja rotación, con stock para ofrecer. Período "+m.periodo+". La meta es subir la salida de lo que hoy se mueve poco y dejar la tienda abastecida antes del evento.";
  document.getElementById("recText").textContent = DATA.recomendacion.texto;
  document.getElementById("recTag").textContent = "Recomendación · "+DATA.opciones[DATA.recomendacion.id].nombre;
  renderCards();
  renderFoco();
  renderLadder();
  renderLista();
  renderAbasto();
  renderFuera();
  renderCriterio();
  document.getElementById("foot").textContent =
    "Rotación: unidades de tienda y web entre octubre 2025 y septiembre 2026, divididas entre 12. Cobertura: stock de la oferta ÷ rotación mensual. "+
    r.modelos+" modelos · "+num(r.unidades)+" unidades. Pedidos y Corporativo quedan fuera del ritmo. Generado "+m.generado+".";
}

function renderCards(){
  const box = document.getElementById("cards");
  box.innerHTML = "";
  const r = DATA.resumen;
  ["rotacion","inventario"].forEach(id=>{
    const o = DATA.opciones[id];
    const el = document.createElement("button");
    el.className = "opt"+(state.op===id?" on":"");
    el.type = "button";
    const rec = DATA.recomendacion.id===id;
    const extra = id==="rotacion"
      ? metric(num(r.rotacion_mediana,2), "rotación mediana, u/mes")+metric(coverTxt(r.cobertura_mediana), "cobertura mediana")
      : metric(num(r.unidades_largas), "unidades con cobertura larga")+metric(num(r.taller), "unidades en taller");
    el.innerHTML =
      '<div class="tag '+(id==="rotacion"?"g":"a")+'">'+(rec?"Lectura recomendada":"La misma oferta")+ '</div>'+
      '<h2>'+esc(o.nombre)+'</h2>'+
      '<div class="frase">'+esc(o.frase)+'</div>'+
      '<div class="metrics">'+
        metric(num(r.modelos), "modelos")+
        metric(num(r.unidades), "unidades")+
        metric(num(r.tienda), "en tienda")+
        metric(num(r.skus), "SKUs")+
        extra+
        metric(pct(r.desc_efectivo), "descuento efectivo")+
        metric(num(r.bajar), "bajar de taller")+
      "</div>";
    el.onclick = ()=>{ state.op=id; state.open=null; render(); };
    box.appendChild(el);
  });
}

function renderFoco(){
  const box = document.getElementById("foco");
  box.innerHTML = "";
  DATA.foco.forEach(m=>{
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<b>"+esc(m.modelo)+"</b><span>"+num(m.stock)+" u · "+coverTxt(m.cover)+" · "+pct(m.descuento)+"</span>";
    b.onclick = ()=>{
      state.q = m.modelo;
      state.tab = "lista";
      state.open = m.modelo;
      document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x.dataset.tab==="lista"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-lista"));
      renderLista();
    };
    box.appendChild(b);
  });
}

function renderLadder(){
  const box = document.getElementById("ladder");
  box.innerHTML = "";
  DATA.tiers.forEach(t=>{
    const models = DATA.modelos.filter(m=>m.rango===t.id);
    const units = models.reduce((s,m)=>s+(m.stock||0),0);
    const d = document.createElement("div");
    d.className = "lad";
    d.innerHTML = "<b>"+pct(t.pct)+"</b><span>"+esc(t.label)+"<br>"+models.length+" modelos · "+num(units)+" u</span>";
    box.appendChild(d);
  });
}

function modelsNow(){
  const rows = DATA.modelos.filter(m=>{
    if(state.macro && m.macro!==state.macro) return false;
    if(state.rango && m.rango!==state.rango) return false;
    if(state.origen && m.origen!==state.origen) return false;
    if(state.q){
      const blob = (m.modelo+" "+m.categoria+" "+m.origen).toLowerCase();
      if(!blob.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  rows.sort((a,b)=>{
    if(state.op==="inventario"){
      return (b.stock||0)-(a.stock||0) || (a.rotacion||0)-(b.rotacion||0);
    }
    return (a.rotacion||0)-(b.rotacion||0) || (b.stock||0)-(a.stock||0);
  });
  return rows;
}

    '<input id="q" placeholder="Buscar modelo, por ejemplo JACKET" value="'+esc(state.q)+'">'+
    '<select id="macro"><option value="">Manufactura y equipamiento</option><option value="Manufactura">Manufactura</option><option value="Equipamiento">Equipamiento</option></select>'+
    '<select id="rango"><option value="">Todos los tramos</option>'+rangos+'</select>'+
    '<select id="origen"><option value="">CC y línea completa</option><option value="Línea completa">Línea completa</option><option value="CC">Solo cola CC</option></select>'+
    '</div>';
  html += '<div class="kpis">'+
    '<div class="kpi"><div class="n">'+rows.length+'</div><div class="l">modelos en pantalla</div></div>'+
    '<div class="kpi"><div class="n">'+num(rows.reduce((s,m)=>s+(m.stock||0),0))+'</div><div class="l">unidades</div></div>'+
    '<div class="kpi"><div class="n">'+num(rows.reduce((s,m)=>s+(m.tienda||0),0))+'</div><div class="l">en tienda</div></div>'+
    '<div class="kpi"><div class="n">'+num(rows.reduce((s,m)=>s+(m.taller||0),0))+'</div><div class="l">en taller</div></div>'+
    '</div>';
  html += '<div class="tablewrap"><table><thead><tr>'+
    '<th>Modelo</th><th>Origen</th><th class="num">SKUs</th><th class="num">Rotación/mes</th><th class="num">Stock</th><th class="num">Tiendas</th><th class="num">Taller</th><th class="num">Cobertura</th><th class="num">Descuento</th><th class="num">Precio BF</th>'+
    '</tr></thead><tbody>';
  rows.forEach(m=>{
    const pill = m.origen==="Línea completa" ? "green" : "";
    const slow = (m.rango==="dormido"||m.rango==="24+") ? "rose" : "";
    html += '<tr class="click" data-modelo="'+esc(m.modelo)+'">'+
      '<td><b>'+esc(m.modelo)+'</b><div style="color:var(--muted);font-size:.75rem">'+esc(m.categoria)+'</div></td>'+
      '<td><span class="pill '+pill+'">'+esc(m.origen)+'</span></td>'+
      '<td class="num">'+num(m.skus)+'</td>'+
      '<td class="num">'+num(m.rotacion,2)+'</td>'+
      '<td class="num"><b>'+num(m.stock)+'</b></td>'+
      '<td class="num">'+num(m.tienda)+'</td>'+
      '<td class="num">'+num(m.taller)+'</td>'+
      '<td class="num"><span class="pill '+slow+'">'+coverTxt(m.cover)+'</span></td>'+
      '<td class="num"><b>'+pct(m.descuento)+'</b>'+(m.tope?'<div style="color:var(--amber);font-size:.72rem">piso de precio</div>':'')+(m.sinPrecio?'<div style="color:var(--amber);font-size:.72rem">sin precio</div>':'')+'</td>'+
      '<td class="num">'+(m.precio?money(m.precio)+" → "+money(m.promo):"—")+'</td></tr>';
    if(state.open===m.modelo){
      const lines = DATA.lineas.filter(x=>x.modelo===m.modelo).sort((a,b)=>(b.stock||0)-(a.stock||0));
      html += '<tr class="subrow"><td colspan="10">'+lines.map(x=>{
        const name = [x.gen,x.color,x.talla].filter(Boolean).join(" · ") || x.sku;
        const precio = x.descuento!=null ? money(x.precio)+" → "+money(x.promo)+" ("+pct(x.descuento)+")" : (x.priced?"sin margen para el mínimo":"sin precio");
        return esc(name)+" · "+esc(x.sku)+" · stock "+num(x.stock)+" (tienda "+num(x.tienda)+", taller "+num(x.taller)+") · "+num(x.rotacion,2)+" u/mes · "+coverTxt(x.cover)+" · "+precio;
      }).join("<br>")+'</td></tr>';
    }
  });
  html += '</tbody></table></div>';
  html += '<p class="lead" style="margin-top:8px">Clic en un modelo para ver talla y color. Rotación es la venta de esos SKU en doce meses, partida entre 12. Cobertura es el stock dividido entre esa rotación. El descuento del modelo está ponderado por unidades.</p>';
  const keepFocus = document.activeElement && document.activeElement.id === "q";
  panel.innerHTML = html;
  const q = panel.querySelector("#q");
  const macro = panel.querySelector("#macro");
  const rango = panel.querySelector("#rango");
  const origen = panel.querySelector("#origen");
  macro.value = state.macro;
  rango.value = state.rango;
  origen.value = state.origen;
  q.oninput = ()=>{ state.q = q.value; renderLista(); };
  if (keepFocus) {
    q.focus();
    const p = q.value.length;
    q.setSelectionRange(p, p);
  }
  macro.onchange = ()=>{ state.macro = macro.value; renderLista(); };
  rango.onchange = ()=>{ state.rango = rango.value; renderLista(); };
  origen.onchange = ()=>{ state.origen = origen.value; renderLista(); };
  panel.querySelectorAll("tr.click").forEach(tr=>{
    tr.onclick = ()=>{
      const id = tr.getAttribute("data-modelo");
      state.open = state.open===id?null:id;
      renderLista();
    };
  });
}

function renderAbasto(){
  const r = DATA.resumen;
  const panel = document.getElementById("panel-abasto");
  let html = '<div class="note"><h3>Qué hay que dejar listo antes del evento</h3>'+
    '<p>Cada tienda que ya vendió el SKU queda con al menos una unidad. El taller cubre ese faltante primero. Lo que sobra se queda en taller para reponer durante la semana. El tope por tienda es cerca de dos meses de su propia venta. WEB cuenta en la rotación y no recibe stock.</p></div>';
  html += '<div class="kpis">'+
    '<div class="kpi"><div class="n">'+num(r.bajar)+'</div><div class="l">unidades a bajar de taller</div></div>'+
    '<div class="kpi"><div class="n">'+num(r.mover)+'</div><div class="l">unidades entre tiendas</div></div>'+
    '<div class="kpi"><div class="n">'+num(r.tienda)+'</div><div class="l">ya están en tienda</div></div>'+
    '<div class="kpi"><div class="n">'+num(r.taller)+'</div><div class="l">siguen en taller</div></div>'+
    '</div>';
  html += '<div class="grid2"><div class="tablewrap"><table><thead><tr><th>Tienda</th><th class="num">Stock hoy</th><th class="num">Venta 12m</th><th class="num">Deben entrar</th><th class="num">Desde taller</th><th class="num">Salen</th><th class="num">Modelos en quiebre</th></tr></thead><tbody>';
  DATA.tiendas.forEach(t=>{
    html += '<tr><td>'+esc(t.tienda)+'</td><td class="num">'+num(t.stock)+'</td><td class="num">'+num(t.venta)+'</td><td class="num"><b>'+num(t.entrar)+'</b></td><td class="num">'+num(t.desdeTaller)+'</td><td class="num">'+num(t.salir)+'</td><td class="num">'+(t.quiebres?('<span class="pill rose">'+t.quiebres+'</span>'):'0')+'</td></tr>';
  });
  html += '</tbody></table></div><div>';
  html += '<div class="note"><h3>Lo primero que baja del taller</h3><div class="bars">';
  const pulls = DATA.pull||[];
  const max = Math.max(...pulls.map(p=>p.unidades), 1);
  pulls.forEach(p=>{
    html += '<div class="barline"><div>'+esc(p.modelo)+'</div><div class="track"><span style="width:'+(100*p.unidades/max)+'%"></span></div><div>'+num(p.unidades)+' u</div></div>';
  });
  if(!pulls.length) html += '<p>El taller no tiene que bajar unidades para cubrir el mínimo de tienda.</p>';
  html += '</div></div></div></div>';
  html += '<h3 style="margin:16px 0 8px;font-size:1rem">Movimientos más grandes</h3>';
  html += '<div class="tablewrap"><table><thead><tr><th>Modelo</th><th>Desde</th><th>Hacia</th><th class="num">Unidades</th></tr></thead><tbody>';
  (DATA.movimientos||[]).slice(0,25).forEach(mv=>{
    html += '<tr><td>'+esc(mv.modelo)+'</td><td>'+esc(mv.desde)+'</td><td>'+esc(mv.hacia)+'</td><td class="num">'+num(mv.unidades)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<p class="lead" style="margin-top:8px">El Excel trae el movimiento SKU por SKU. Quiebre: la tienda vendió ese modelo en el año y hoy no tiene ninguna unidad de la oferta.</p>';
  panel.innerHTML = html;
}

function renderFuera(){
  const panel = document.getElementById("panel-fuera");
  const groups = {};
  DATA.excluidos.forEach(r=>{ (groups[r.motivo] = groups[r.motivo] || []).push(r); });
  let html = '<div class="note"><h3>Salen de la oferta</h3><p>Zenit, Refresh y Motion Loop quedan fuera de esta propuesta. Abajo está el inventario, para que el recorte se vea en unidades.</p></div>';
  ["Zenit","Refresh","Motion Loop"].forEach(motivo=>{
    const rows = groups[motivo]||[];
    if(!rows.length) return;
    const units = rows.reduce((s,r)=>s+(r.stock||0),0);
    html += '<h3 style="margin:14px 0 8px;font-size:1rem">'+esc(motivo)+' · '+num(units)+' unidades</h3>';
    html += '<div class="tablewrap"><table><thead><tr><th>Modelo</th><th class="num">Stock</th><th class="num">Tiendas</th><th class="num">Taller</th><th class="num">Venta 12m</th><th class="num">Rotación/mes</th><th class="num">Cobertura</th></tr></thead><tbody>';
    rows.forEach(r=>{
      html += '<tr><td>'+esc(r.modelo)+'</td><td class="num">'+num(r.stock)+'</td><td class="num">'+num(r.tienda)+'</td><td class="num">'+num(r.taller)+'</td><td class="num">'+num(r.qty12)+'</td><td class="num">'+num(r.rotacion,2)+'</td><td class="num">'+coverTxt(r.cover)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  const sin = DATA.modelos.filter(m=>m.sinPrecio);
  if(sin.length){
    html += '<div class="call"><h3 style="margin:0 0 6px">En la lista, y todavía sin precio</h3>';
    sin.forEach(s=>{
      html += '<p style="margin:4px 0"><b>'+esc(s.modelo)+'</b> · '+num(s.stock)+' unidades. El ABC no trae precio de estos SKU, así que no llevan porcentaje.</p>';
    });
    html += '</div>';
  }
  html += '<div class="note"><h3>Cola CC con menos de 5 unidades</h3><p>'+
    DATA.polvo.modelos+' modelos y '+num(DATA.polvo.unidades)+' unidades del cuadro de rotación quedan fuera del evento: no alcanzan para armar una oferta. '+
    (DATA.polvo.lista||[]).slice(0,8).map(r=>esc(r.modelo)).join(", ")+
    (DATA.polvo.modelos>8 ? "…" : "")+
    '.</p></div>';
  panel.innerHTML = html;
}

function renderCriterio(){
  const panel = document.getElementById("panel-criterio");
  panel.innerHTML =
    '<div class="grid2"><div class="note"><h3>De dónde sale la lista</h3>'+
    '<p>La base es el cuadro de rotación: SKU con stock, manufactura y equipamiento, cola de margen y cola de rotación, de octubre 2025 a septiembre 2026. Esa es la opción de rotación del dashboard de categoría C. Ahí ya estaban fuera Cuadro Band, Short Playa y Clásica GC sublimado kids.</p>'+
    '<p style="margin-top:8px">Sobre esa lista se hacen tres ajustes. Zenit, Refresh y Motion Loop salen. Jacket 1.0 (Caballero, Dama y Kids) entra con el inventario completo de la línea. Short Sport Kids y Short Sport R1 entran igual, con el stock de toda la línea. Cuadro Jacket 2.0 permanece en el recorte CC: 48 unidades del SKU kids. El resto de la 2.0 sigue fuera de esta oferta.</p></div>'+
    '<div class="note"><h3>Cómo se lee cada número</h3>'+
    '<p>Rotación al mes = unidades vendidas en tienda y web durante los doce meses, divididas entre 12. Cobertura = stock de la oferta dividido entre esa rotación. Pedidos y Corporativo no entran al ritmo: son bultos, no piso.</p>'+
    '<p style="margin-top:8px">El descuento sigue la cobertura: menos de 6 meses 15%, de 6 a 12 meses 20%, de 12 a 18 meses 25%, de 18 a 24 meses 30%, más de 24 meses 35%, sin salida en el año 40%. El precio promo se sostiene en costo × 1,10 o por encima. Si el margen no alcanza el tramo, el porcentaje baja de cinco en cinco. Si no llega al 10%, ese SKU se muestra y no lleva descuento.</p></div></div>'+
    '<div class="note"><h3>Las dos lecturas</h3>'+
    '<p>Opción A ordena por rotación mensual, de menor a mayor. Opción B ordena por stock, de mayor a menor. Las unidades, el descuento y el plan de abastecimiento son los mismos. Jacket Kids y Short Sport Kids se ven primero en inventario porque concentran unidades; en rotación aparecen según lo que venden al mes.</p></div>'+
    '<div class="note"><h3>Abastecimiento</h3>'+
    '<p>Por cada SKU con descuento: la tienda que lo vendió en el año recibe al menos una unidad antes del evento. El taller entrega primero. Si una tienda tiene de más, cede hacia la que está en quiebre, y se queda con su tope (cerca de dos meses de su propia venta, con un piso de dos unidades). Lo que resta se queda en taller para reponer en la semana.</p></div>';
}

document.getElementById("tabs").onclick = (e)=>{
  const b = e.target.closest("button");
  if(!b) return;
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-"+state.tab));
};
render();
</script>
</body>
</html>
