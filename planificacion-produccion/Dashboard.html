<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Planificación de Producción</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0e0f14;--surf:#16171f;--s2:#1e1f2b;--s3:#252637;--brd:#2a2b3a;--tx:#f0f0f5;--mu:#7a7b95;--mu2:#4a4b65;--ac:#5b6af7;--a2:#f75b8a;--gr:#4caf76;--rd:#ef4444;--yw:#ffc107;--l5:#a78bfa;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--r:14px}
body.light{--bg:#f5f6fa;--surf:#ffffff;--s2:#f0f1f5;--s3:#e5e6ed;--brd:#d8d9e3;--tx:#1a1a2e;--mu:#6b6c85;--mu2:#9a9bb5;--ac:#5b6af7;--a2:#f75b8a;--gr:#2e9e5e;--rd:#dc3545;--yw:#e6a800;--l5:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;transition:background .3s,color .3s}
.hdr{background:linear-gradient(135deg,#0d0e13 0%,#191a2d 55%,#0d0e13 100%);border-bottom:1px solid var(--brd);padding:18px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
body.light .hdr{background:linear-gradient(135deg,#e8e9f3 0%,#f5f6fa 55%,#e8e9f3 100%)}
.hdr-l h1{font-family:var(--fh);font-size:1.55rem;font-weight:800;letter-spacing:-.5px}
.hdr-l h1 em{color:var(--ac);font-style:normal}
#status{color:var(--mu);font-size:.8rem;margin-top:2px}
#status:empty{display:none}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpi-bar{display:flex;gap:10px;flex-wrap:wrap}
.kpib{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:9px 14px;text-align:center;min-width:76px}
.kpib .kv{font-family:var(--fh);font-size:1.3rem;font-weight:800;color:var(--ac);line-height:1}
.kpib .kl{font-size:.64rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.theme-btn,.fbtn{background:var(--s2);border:1px solid var(--brd);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.76rem;font-family:var(--fb);transition:all .2s}
.theme-btn:hover,.fbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.mbar{background:var(--s2);border-bottom:2px solid var(--brd);padding:12px 40px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mbar-lbl{font-size:.68rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-right:4px;white-space:nowrap}
.mbtn{display:flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--brd);color:var(--mu);border-radius:20px;padding:6px 12px;font-family:var(--fb);font-size:.72rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.mbtn:hover{background:rgba(91,106,247,.15);color:var(--tx);border-color:var(--ac)}
.mbtn.active{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.mbtn .mcnt{background:rgba(255,255,255,.22);border-radius:10px;padding:1px 6px;font-size:.62rem;font-weight:700}
.mbtn:not(.active) .mcnt{background:var(--mu2);color:var(--bg)}
.wbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.wbar-lbl{font-size:.62rem;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-right:2px}
.wchip{background:var(--s3);border:1px solid var(--brd);color:var(--mu);border-radius:999px;padding:4px 9px;font-family:var(--fb);font-size:.68rem;font-weight:600;cursor:pointer;line-height:1.2}
.wchip:hover{border-color:var(--ac);color:var(--tx)}
.wchip.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.pend-n{font-family:var(--fh);font-size:1.4rem;font-weight:800;line-height:1.1}
.pend-n.ac{color:var(--ac)}
.pend-n.a2{color:var(--a2)}
.pend-n.yw{color:var(--yw)}
.pend-block{margin-top:16px}
.pend-block:first-child{margin-top:0}
.fbar{background:var(--surf);border-bottom:1px solid var(--brd);padding:10px 40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbar label{font-size:.68rem;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.fbar select,.fbar input{background:var(--s2);color:var(--tx);border:1px solid var(--brd);border-radius:7px;padding:5px 10px;font-family:var(--fb);font-size:.78rem;outline:none}
.fbar select:focus,.fbar input:focus{border-color:var(--ac)}
.ebar{background:var(--surf);border-bottom:1px solid var(--brd);padding:7px 40px;display:flex;gap:8px;align-items:center}
.ebar button{background:var(--s2);color:var(--mu);border:1px solid var(--brd);border-radius:7px;padding:5px 12px;font-family:var(--fb);font-size:.73rem;cursor:pointer}
.ebar button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:2px;padding:12px 40px 0;border-bottom:1px solid var(--brd);background:var(--surf);overflow-x:auto}
.tab{padding:8px 16px;font-family:var(--fh);font-size:.78rem;font-weight:700;color:var(--mu);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
.tab.active{color:var(--tx);border-bottom-color:var(--ac);background:var(--s2)}
.tab:hover:not(.active){color:var(--tx);background:rgba(255,255,255,.04)}
.content{padding:22px 40px;max-width:1600px;margin:0 auto}
.sec{display:none}.sec.active{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.tkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.tkpi{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:11px;text-align:center}
.tkpi .tv{font-family:var(--fh);font-size:1.15rem;font-weight:800;color:var(--ac)}
.tkpi .tl{font-size:.66rem;color:var(--mu);text-transform:uppercase;margin-top:2px}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card:hover{border-color:#3a3b55}
.card h3{font-family:var(--fh);font-size:.88rem;font-weight:700;margin-bottom:2px}
.sub{font-size:.7rem;color:var(--mu);margin-bottom:12px}
.cw{position:relative;height:220px}.cw.t{height:280px}
.ctwrap{overflow:auto;max-height:560px}
.ct{width:100%;border-collapse:collapse;font-size:.78rem}
.ct th{color:var(--mu);padding:6px 8px;text-align:left;border-bottom:1px solid var(--brd);font-size:.64rem;text-transform:uppercase;position:sticky;top:0;background:var(--surf);z-index:1;white-space:nowrap}
.ct td{padding:7px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
.ct tr:hover td{background:rgba(91,106,247,.06)}
.num{font-family:var(--fh);font-weight:700;text-align:right;white-space:nowrap}
.ct.ct-mid th,.ct.ct-mid td{text-align:center}
.ct.ct-mid th.left,.ct.ct-mid td.left{text-align:left}
.ct.ct-mid .num{text-align:center}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;font-size:.68rem;font-weight:800;color:#fff;margin:0 2px}
.c1{background:#5b6af7}.c2{background:#f75b8a}.c3{background:#4caf76}.c4{background:#e6a800}.c5{background:#7c3aed}
.heat{border-radius:8px;padding:6px 4px;text-align:center;font-family:var(--fh);font-weight:800;font-size:.78rem;min-width:52px}
.daycell{min-height:64px;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.68rem}
.daycell b{display:block;font-size:.62rem;color:var(--mu);margin-bottom:4px}
.dayhead{min-height:auto;background:linear-gradient(180deg,rgba(91,106,247,.22),rgba(91,106,247,.08));border:1px solid rgba(91,106,247,.45);border-bottom:3px solid var(--ac);border-radius:10px;padding:10px 8px 9px;text-align:center}
.dayhead .dn{display:block;font-family:var(--fh);font-size:.84rem;font-weight:800;color:var(--tx);letter-spacing:.2px;line-height:1.15}
.dayhead .dd{display:block;margin-top:4px;font-family:var(--fh);font-size:.78rem;font-weight:700;color:var(--ac)}
body.light .dayhead{background:linear-gradient(180deg,#eef0ff,#e4e7fb);border-color:#c5caf5}
.pill{display:inline-block;background:var(--s3);border-radius:999px;padding:2px 7px;margin:1px;font-size:.64rem}
.tl{width:100%;border-collapse:separate;border-spacing:0}
.tl th,.tl td{padding:8px 6px;border-bottom:1px solid var(--brd);text-align:center;min-width:70px}
.tl th{font-size:.62rem;color:var(--mu);text-transform:uppercase;position:sticky;top:0;background:var(--surf);z-index:2}
.tl td.prod{text-align:left;font-weight:700;font-family:var(--fh);font-size:.74rem;white-space:nowrap;position:sticky;left:0;background:var(--surf);max-width:240px;overflow:hidden;text-overflow:ellipsis;min-width:200px;z-index:1}
.tl-dots{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}
.note{background:var(--s2);border-left:3px solid var(--ac);padding:10px 12px;border-radius:8px;font-size:.78rem;color:var(--mu);margin-bottom:8px}
.note.expand{cursor:pointer;user-select:none}
.note.expand:before{content:'▸ ';color:var(--ac)}
.note.expand.open:before{content:'▾ '}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px}
.b-ok{background:rgba(76,175,118,.2);color:var(--gr)}
.b-bad{background:rgba(239,68,68,.2);color:var(--rd)}
.b-mut{background:var(--s3);color:var(--mu)}
.tr-exp{cursor:pointer}
.tr-exp .chev{color:var(--ac);display:inline-block;width:14px}
.sku-row td{background:var(--s2);font-size:.72rem}
.cal-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:6px}
.imp-week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.imp-week .imp-meta{flex:1}
.imp-week.imp-done{border-left-color:var(--ac)}
.imp-leyenda{border:1px solid var(--yw);border-left:3px solid var(--yw);background:rgba(255,193,7,.08);color:var(--tx);margin-bottom:14px}
.imp-chk{display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;vertical-align:middle;user-select:none}
.imp-chk input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:2px solid var(--ac);border-radius:4px;background:rgba(91,106,247,.12);cursor:pointer;position:relative;vertical-align:middle;box-shadow:0 0 0 1px rgba(91,106,247,.35)}
.imp-chk input:hover{background:rgba(91,106,247,.22)}
.imp-chk input:checked{background:var(--ac);border-color:var(--ac)}
.imp-chk input:checked:after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.imp-chk input:indeterminate{background:rgba(91,106,247,.5);border-color:var(--ac)}
.imp-chk input:indeterminate:after{content:'';position:absolute;left:3px;top:6px;width:8px;height:2px;background:#fff;border:none;transform:none}
.imp-chk span{font-size:.62rem;color:var(--mu);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.imp-chk.ok span{color:var(--ac);font-weight:700}
.imp-savebar{position:sticky;top:0;z-index:5;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imp-savebar button{background:var(--s3);border:1px solid var(--brd);color:var(--tx);border-radius:8px;padding:8px 16px;font-family:var(--fh);font-weight:800;font-size:.78rem;cursor:pointer}
.imp-savebar button.dirty{background:var(--ac);color:#fff;border-color:var(--ac)}
.imp-savebar button:disabled{opacity:.5;cursor:default}
.imp-save-msg{font-size:.75rem;color:var(--mu)}
.imp-save-msg.dirty{color:var(--yw);font-weight:700}
.imp-save-msg.ok{color:var(--gr)}
.footer{text-align:center;color:var(--mu);font-size:.68rem;padding:14px 40px;border-top:1px solid var(--brd);margin-top:8px}
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.g2,.g3,.cal-grid{grid-template-columns:1fr}.content,.fbar,.tabs,.hdr,.ebar,.mbar{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <h1>Planificación · <em id="titleModelo">información</em></h1>
    <p id="status"></p>
  </div>
  <div class="hdr-r">
    <div class="kpi-bar">
      <div class="kpib"><div class="kv" id="k-plan">—</div><div class="kl" id="k-plan-lbl">Plan</div></div>
      <div class="kpib"><div class="kv" id="k-pend">—</div><div class="kl">Pendiente</div></div>
      <div class="kpib"><div class="kv" id="k-alm">—</div><div class="kl">A Producir</div></div>
      <div class="kpib"><div class="kv" id="k-mod">—</div><div class="kl">Modelos</div></div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
  </div>
</div>
<div class="mbar" id="mbar">
  <span class="mbar-lbl">Modelo:</span>
</div>
<div class="fbar">
  <label>Buscar</label>
  <input id="q" placeholder="Modelo / SKU / MO" oninput="onFilter()">
  <label>Línea</label>
  <select id="f-lin" onchange="onFilter()"><option value="">Todas</option></select>
  <label>Semana</label>
  <select id="f-sem" onchange="onFilter()"></select>
  <button class="fbtn" onclick="resetFilters()">↺ Limpiar</button>
</div>
<div class="ebar">
  <button onclick="exportCSV()">📥 CSV</button>
  <span style="font-size:.66rem;color:var(--mu)">Exporta la pestaña activa</span>
</div>
<div class="tabs">
  <button class="tab active" data-tab="cal">📅 Calendario</button>
  <button class="tab" data-tab="salida">📦 Salida semanal</button>
  <button class="tab" data-tab="seg">● Seguimiento</button>
  <button class="tab" data-tab="pend">⏳ Pendientes</button>
  <button class="tab" data-tab="alm">🏭 Almacén</button>
  <button class="tab" data-tab="sup">⚙️ Supuestos</button>
  <button class="tab" data-tab="imp">🖨 Impresión Digital</button>
</div>
<div class="content">
  <div id="boot-fail" class="note">Cargando el snapshot publicado… Si ves este texto, ejecuta en la hoja <b>⚙️ Producción → 🔄 Actualizar Dashboard</b>.</div>
  <noscript><div class="note">Activa JavaScript o ábrelo en Chrome. Sin JS no se pueden ver los números.</div></noscript>
  <div id="sec-cal" class="sec active"></div>
  <div id="sec-salida" class="sec"></div>
  <div id="sec-seg" class="sec"></div>
  <div id="sec-pend" class="sec"></div>
  <div id="sec-alm" class="sec"></div>
  <div id="sec-sup" class="sec"></div>
  <div id="sec-imp" class="sec"></div>
</div>
<div class="footer">Planificación de producción · v<span id="footVer"></span> · App Script (mismo enlace para todos)</div>
<script>
var DATA = null;
var D = null;
var CI = {};
var _modelos = [];
var _theme = 'dark';
var _tab = 'cal';
var LINE_COLORS = {1:'#5b6af7',2:'#f75b8a',3:'#4caf76',4:'#e6a800',5:'#7c3aed'};
var DIAS = ['lunes','martes','miercoles','jueves','viernes'];
var DIA_LBL = ['Lunes','Martes','Miércoles','Jueves','Viernes'];

function weekKeys() {
  var s = D.semanas || {};
  return Object.keys(s).sort(function(a,b){ return parseInt(a.replace(/\D/g,''),10)-parseInt(b.replace(/\D/g,''),10); });
}
function nSem(){ return (D.supuestos && D.supuestos.semanas) || weekKeys().length || 12; }
function fmtN(n){ n = Number(n)||0; return n.toLocaleString('es-CO',{maximumFractionDigits:0}); }
function linCls(l){ var n = String(l).replace(/\D/g,''); return 'c'+(n||'1'); }
function q(){ return (document.getElementById('q').value||'').toLowerCase().trim(); }
function fLin(){ return document.getElementById('f-lin').value; }
function fSem(){ return document.getElementById('f-sem').value; }
function matchQ(s){ var t=q(); return !t || String(s||'').toLowerCase().indexOf(t)!==-1; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
function shortMod(m){
  var s=String(m||'');
  s=s.replace(/\s*\(MAFE.*?Especial\)/i,'');
  s=s.replace(/\s*\(Especial\)/i,'');
  s=s.replace('MOTION LOOP ','ML ');
  s=s.replace('SHORT SPORT ','SS ');
  s=s.replace('VESTIDO ','V. ');
  return s.trim() || String(m);
}
function txCol(){ return _theme==='light'?'#1a1a2e':'#f0f0f5'; }
function bo(stacked){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{legend:{display:!!stacked, labels:{color:'#7a7b95', font:{family:'DM Sans', size:11}}}, tooltip:{backgroundColor:'#1e1f2b', borderColor:'#2a2b3a', borderWidth:1, titleFont:{family:'Syne', weight:'bold'}, bodyFont:{family:'DM Sans'}, padding:10}},
    scales:{
      x:{stacked:!!stacked, grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#7a7b95', font:{family:'DM Sans', size:11}}},
      y:{stacked:!!stacked, grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#7a7b95', font:{family:'DM Sans', size:11}}}
    }
  };
}
function mc(id,type,data,opts){
  if(typeof Chart==='undefined') return null;
  if(CI[id]) try{ CI[id].destroy(); }catch(e){}
  var el=document.getElementById(id); if(!el) return null;
  try{
    CI[id]=new Chart(el.getContext('2d'),{type:type, data:data, options:opts});
  }catch(e){ return null; }
  return CI[id];
}

function hayGas(){
  return typeof google!=='undefined' && google.script && typeof google.script.run==='object';
}
function boot(){
  if(hayGas()){
    var st=document.getElementById('status');
    if(st) st.textContent='Cargando dashboard publicado…';
    google.script.run
      .withSuccessHandler(onDashPayload)
      .withFailureHandler(onDashFail)
      .leerDashboardPublicado();
    return;
  }
  if(!D){
    var el=document.getElementById('dash-data');
    if(el){
      try{ DATA=JSON.parse(el.textContent); D=DATA; }catch(e){}
    }
  }
  if(!D){
    document.getElementById('status').textContent='Abre este dashboard desde el enlace de Apps Script, o ejecuta Actualizar Dashboard en la hoja.';
    return;
  }
  startUi();
}
function onDashFail(err){
  var msg=String(err&&err.message?err.message:err||'Error al leer el dashboard');
  var st=document.getElementById('status');
  if(st){ st.textContent=msg; st.style.color='var(--rd)'; }
  var bf=document.getElementById('boot-fail');
  if(bf) bf.innerHTML=esc(msg);
}
function onDashPayload(resp){
  if(typeof resp==='string'){
    try{ resp=JSON.parse(resp); }catch(e){ onDashFail(e); return; }
  }
  if(!resp || !resp.success || !resp.data){
    var msg=(resp && resp.error) || 'Ejecuta en la hoja: Producción → Actualizar Dashboard.';
    var st=document.getElementById('status');
    if(st){ st.textContent=msg; st.style.color='var(--yw)'; }
    var bf=document.getElementById('boot-fail');
    if(bf) bf.innerHTML=esc(msg);
    return;
  }
  DATA=resp.data; D=DATA;
  if(resp.version && !D.version) D.version=resp.version;
  window._publicadoEn=resp.publicadoEn||'';
  if(hayGas()){
    google.script.run
      .withSuccessHandler(function(stChecks){ aplicarChecksServidor_(stChecks); startUi(); })
      .withFailureHandler(function(){ aplicarChecksServidor_({}); startUi(); })
      .leerChecksImpresion();
    return;
  }
  startUi();
}
function startUi(){
  if(!D){
    document.getElementById('status').textContent='No hay datos para dibujar.';
    return;
  }
  var bf=document.getElementById('boot-fail'); if(bf) bf.remove();
  var n=nSem();
  var st=document.getElementById('status');
  if(st){ st.textContent=''; st.style.color=''; }
  var lbl=document.getElementById('k-plan-lbl'); if(lbl) lbl.textContent='Plan '+n+' sem';
  document.getElementById('footVer').textContent = (D.version||'')+(window._publicadoEn?' · '+window._publicadoEn:'');
  fillFilters();
  fillModelos();
  var m='';
  try{ m=(new URLSearchParams(location.search)).get('modelo')||''; }catch(e){}
  var h=(location.hash||'').replace('#','');
  if(h){
    var b=document.querySelector('.tab[data-tab="'+h+'"]');
    if(b){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.sec').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      _tab=h;
      var sec=document.getElementById('sec-'+_tab);

function agruparCarga(carga, wi){
  var order=[], map={};
  (carga||[]).forEach(function(c){
    var m=c.modelo;
    if(!map[m]){
      map[m]={modelo:m, lineas:[], mos:0, solicitada:0, total:0};
      order.push(m);
    }
    var g=map[m];
    var lin=String(c.linea).replace(/\D/g,'');
    if(lin && g.lineas.indexOf(lin)<0) g.lineas.push(lin);
    g.mos += Number(c.mos)||0;
    g.solicitada += Number(c.solicitada)||0;
    g.total += Number(c.total)||0;
  });
  return order.map(function(m){
    var g=map[m];
    g.lineas.sort(function(a,b){ return (parseInt(a,10)||0)-(parseInt(b,10)||0); });

function filasImpRaw(modelo, wi){

function cargaImp(k, wi){

function checksIguales_(a, b){
  a=a||{}; b=b||{};
  var ka=Object.keys(a), kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  for(var i=0;i<ka.length;i++) if(!b[ka[i]]) return false;

}

      else if(_impDirty) t='Hay checks sin guardar. Si sales del dashboard, estos cambios no quedan en la hoja.';
    }

function itemsParaGuardarImp_(){
  var items=[], seen={};
  function add(k, on){
    if(!k || seen[k]) return;
    seen[k]=1;
    var meta=_impMeta[k]||{};
    var mo=meta.mo||'';
    var sku=meta.sku||'';
    if(!mo && !sku){
      if(k.indexOf('M|')===0){
        var rest=k.substring(2), i=rest.indexOf('|');
        mo=i===-1?rest:rest.substring(0,i);
        sku=i===-1?'':rest.substring(i+1);
      } else if(k.indexOf('S|')===0){
        sku=k.substring(2);
      }
    }
    items.push({clave:k, mo:mo, sku:sku, semana:meta.semana!=null?String(meta.semana):'', listo:!!on});
  }
  Object.keys(_impChecks).forEach(function(k){ add(k, true); });
  Object.keys(_impSaved).forEach(function(k){ if(!_impChecks[k]) add(k, false); });
  return items;
}

window.guardarImpresion=function(){

    return;
  }
  var items=itemsParaGuardarImp_();
  _impGuardando=true;
  pintarEstadoGuardarImp_();
  persistCheckItems(items, function(res){
    _impGuardando=false;

      pintarEstadoGuardarImp_('No se pudo guardar'+(res&&res.error?': '+res.error:'')+'.');
      return;

function primerDiaCarga(c){
  for(var i=0;i<DIAS.length;i++){
    if(c.dias && (Number(c.dias[DIAS[i]])||0)>0) return i;
  }
  return 99;
}
function renderSeg(){
  var el=document.getElementById('sec-seg');
  var keys=weekKeys();

  var seq=0;
  keys.forEach(function(k, wi){
    cargaFiltrada(k).forEach(function(c){
      var l=String(c.linea).replace(/\D/g,'');
      if(!map[c.modelo]){
        map[c.modelo]={weeks:keys.map(function(){ return []; }), tot:0, ord:[wi, primerDiaCarga(c), parseInt(l,10)||9, seq]};
      }
      seq++;
      if(map[c.modelo].weeks[wi].indexOf(l)<0) map[c.modelo].weeks[wi].push(l);
      map[c.modelo].tot += Number(c.total)||0;
    });
  });
  var mods=Object.keys(map).sort(function(a,b){
    var A=map[a].ord, B=map[b].ord;

function csvEsc(v){ var s=String(v==null?'':v); if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"'; return s; }
function downloadCSV(name, rows){
  var txt=rows.map(function(r){ return r.map(csvEsc).join(','); }).join('\n');
  var blob=new Blob(['\ufeff'+txt], {type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

    downloadCSV('planificacion-seguimiento.csv', rows);

function paintTab(){
  if(!D) return;
  if(_tab==='cal') renderCal();
  else if(_tab==='salida') renderSalida();
  else if(_tab==='imp') renderImp();
  else if(_tab==='seg') renderSeg();
  else if(_tab==='pend') renderPend();
  else if(_tab==='alm') renderAlm();
  else if(_tab==='sup') renderSup();
}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.sec').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    _tab=b.getAttribute('data-tab');
    document.getElementById('sec-'+_tab).classList.add('active');
    try { history.replaceState(null,'','#'+_tab); } catch(e) {}
    paintTab();
  });
});
(function(){
  var h=(location.hash||'').replace('#','');
  if(h){
    var b=document.querySelector('.tab[data-tab="'+h+'"]');
    if(b) b.click();
  }
})();
window.addEventListener('beforeunload', function(e){
  if(!_impDirty) return;
  var aviso='Hay checks de Impresión Digital sin guardar. Pulsa Guardar para no perderlos.';
  e.preventDefault();
  e.returnValue=aviso;
  return aviso;
});
try { boot(); } catch (e) {
  var st=document.getElementById('status');
  if(st){ st.textContent='Error al dibujar el dashboard: '+e.message; st.style.color='var(--rd)'; }
}
</script>
</body>
